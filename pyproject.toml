[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parakeet-context-fusion"
version = "0.1.0"
description = "Japanese TDT/CTC contextual ASR fusion experiments for Parakeet"
requires-python = ">=3.10,<3.13"
dependencies = [
  "datasets>=4.0,<5",
  "huggingface-hub>=0.34,<2",
  "jsonschema>=4.23",
  "numpy>=1.26",
  "omegaconf>=2.3",
  "pyarrow>=15",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "soundfile>=0.12",
  "torch>=2.4",
]

[project.optional-dependencies]
nemo = ["nemo_toolkit[asr]>=2.4,<3"]
g2p = ["pyopenjtalk>=0.4"]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
