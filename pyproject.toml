[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parakeet-context-fusion"
version = "0.1.0"
description = "Japanese TDT/CTC contextual ASR fusion experiments for Parakeet"
requires-python = "==3.12.3"
dependencies = [
  "datasets>=4.0,<5",
  "huggingface-hub==1.28.0",
  "jiwer==4.0.0",
  "jsonschema>=4.23",
  "numpy==2.3.2",
  "omegaconf>=2.3",
  "pandas==2.3.2",
  "pyarrow>=15",
  "pydantic==2.11.7",
  "pyyaml==6.0.2",
  "soundfile>=0.12",
]

[project.optional-dependencies]
gpu = [
  "nemo-toolkit[asr,cu13]==3.0.0",
  "torch==2.12.0+cu132",
]
llm = [
  "accelerate>=1.10,<2",
  "safetensors>=0.5",
  "transformers==4.57.3",
]
runpod = ["runpod==1.12.0"]
vast = ["vastai==1.5.6"]
g2p = ["pyopenjtalk-plus==0.4.1.post9"]
audio = ["pyopenjtalk-plus==0.4.1.post9"]
dev = [
  "hypothesis==6.165.10",
  "pytest>=8.3,<9",
  "ruff==0.12.11",
]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv]
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
conflicts = [
  [
    { extra = "runpod" },
    { extra = "vast" },
  ],
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "gpu: requires the authoritative Linux x86_64 CUDA13 NeMo runtime",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
