name: hf-model-artifact-publish

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: "HF Bucket candidate ID, e.g. candidate-000001"
        required: true
        type: string
      release_name:
        description: "Model Repo release path; must match candidate release manifest"
        required: true
        type: string
      source_run_id:
        description: "Optional Bucket run ID to receive promotion.json"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: hf-model-promotion-${{ inputs.candidate_id }}-${{ inputs.release_name }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 90
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_BUCKET: saeeew/J-PACF-YOMI-tdt-bucket
      HF_MODEL_REPO: saeeew/J-PACF-YOMI-tdt
      FETCH_ROOT: artifacts/promotion-fetch
      RELEASE_ROOT: dist/hf-model-promotion
    steps:
      - uses: actions/checkout@v7

      - name: Restore pip download cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: hf-promotion-pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml') }}

      - name: Validate promotion inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo "HF_TOKEN is missing" >&2; exit 2; }
          [[ "${{ inputs.candidate_id }}" =~ ^candidate-[0-9]{6}$ ]] || {
            echo "candidate_id must match candidate-NNNNNN" >&2
            exit 2
          }
          [[ "${{ inputs.release_name }}" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "release_name must be path-safe" >&2
            exit 2
          }
          if [[ -n "${{ inputs.source_run_id }}" ]]; then
            [[ "${{ inputs.source_run_id }}" =~ ^[A-Za-z0-9._-]+$ ]] || {
              echo "source_run_id must be path-safe" >&2
              exit 2
            }
          fi

      - name: Install Bucket-capable Hub client
        run: python -m pip install 'huggingface-hub>=1.9,<2'

      - name: Fetch and validate candidate
        shell: bash
        run: |
          set -euo pipefail
          destination="${FETCH_ROOT}/${{ inputs.candidate_id }}"
          bash scripts/hf/hf-fetch-candidate.sh "${{ inputs.candidate_id }}" "${destination}"
          candidate_release="$(python - "${destination}/release_manifest.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          print(json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["release"])
          PY
          )"
          [[ "${candidate_release}" == "${{ inputs.release_name }}" ]] || {
            echo "candidate release ${candidate_release} does not match requested release ${{ inputs.release_name }}" >&2
            exit 2
          }

      - name: Validate optional standalone checkpoint
        shell: bash
        run: |
          set -euo pipefail
          checkpoint="${FETCH_ROOT}/${{ inputs.candidate_id }}/J-PACF-YOMI-TDT.nemo"
          if [[ -f "${checkpoint}" ]]; then
            CHECKPOINT_PATH="${checkpoint}" python - <<'PY'
          import os
          import nemo.collections.asr as nemo_asr
          model = nemo_asr.models.ASRModel.restore_from(os.environ["CHECKPOINT_PATH"], map_location="cpu")
          print(type(model).__name__)
          PY
          fi

      - name: Build clean promotion directory
        shell: bash
        run: |
          set -euo pipefail
          source="${FETCH_ROOT}/${{ inputs.candidate_id }}"
          release_dir="${RELEASE_ROOT}/${{ inputs.release_name }}"
          rm -rf "${release_dir}"
          mkdir -p "${release_dir}"
          cp -a "${source}/." "${release_dir}/"
          rm -f "${release_dir}/.candidate-id" "${release_dir}/metadata.json"
          python - "${release_dir}/promotion.json" <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          payload = {
              "schema_version": 1,
              "candidate_id": "${{ inputs.candidate_id }}",
              "release": "${{ inputs.release_name }}",
              "model_repo": os.environ["HF_MODEL_REPO"],
              "bucket": os.environ["HF_BUCKET"],
              "source_run_id": "${{ inputs.source_run_id }}" or None,
              "promoted_at": datetime.now(timezone.utc).isoformat(),
              "source_git_sha": os.environ.get("GITHUB_SHA"),
          }
          Path(sys.argv[1]).write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Publish validated release to Model Repo
        run: |
          python scripts/publish_hf_model_release.py \
            --repo-id "${HF_MODEL_REPO}" \
            --release "${{ inputs.release_name }}" \
            --release-dir "${RELEASE_ROOT}/${{ inputs.release_name }}" \
            --commit-message "Promote ${{ inputs.candidate_id }} as J-PACF-YOMI-TDT ${{ inputs.release_name }}"

      - name: Attach promotion record to source run
        if: ${{ inputs.source_run_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          remote_path="runs/${{ inputs.source_run_id }}/promotion.json"
          existing="$(hf buckets list "${HF_BUCKET}/runs/${{ inputs.source_run_id }}" -R -q --token "${HF_TOKEN}" || true)"
          if printf '%s\n' "${existing}" | grep -Fxq "${remote_path}"; then
            echo "promotion record already exists: ${remote_path}" >&2
            exit 2
          fi
          hf buckets cp \
            --token "${HF_TOKEN}" \
            "${RELEASE_ROOT}/${{ inputs.release_name }}/promotion.json" \
            "hf://buckets/${HF_BUCKET}/${remote_path}"

      - name: Upload promotion evidence
        uses: actions/upload-artifact@v7
        with:
          name: jpacf-promotion-${{ inputs.candidate_id }}-${{ inputs.release_name }}
          path: ${{ env.RELEASE_ROOT }}/${{ inputs.release_name }}
          retention-days: 30
          if-no-files-found: error
