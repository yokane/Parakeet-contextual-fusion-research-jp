name: pr5-review-fix

on:
  push:
    branches: [feat/hf-bucket-ghcr-cache]
    paths:
      - ".github/workflows/pr5-review-fix.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Apply deterministic review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflows = {
              ".github/workflows/homophone-eval-gpu.yml": "Upload experiment artifact",
              ".github/workflows/homophone-saturation-gpu.yml": "Upload saturation artifact",
              ".github/workflows/homophone-context-stress-gpu.yml": "Upload context-stress artifact",
          }
          for filename, step_name in workflows.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              old = f"      - name: {step_name}\n        uses: actions/upload-artifact@"
              new = f"      - name: {step_name}\n        if: ${{{{ always() }}}}\n        uses: actions/upload-artifact@"
              if old not in text:
                  raise SystemExit(f"expected upload step not found: {filename}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_hf_bucket_storage.py")
          text = test_path.read_text(encoding="utf-8")
          marker = "\n\ndef test_candidate_roundtrip_detects_tampering(tmp_path: Path) -> None:\n"
          regression = '''\n\ndef test_candidate_validation_rejects_unmanifested_file(tmp_path: Path) -> None:\n    release_root = tmp_path / "release"\n    candidate_dir = tmp_path / "candidate"\n    subprocess.run(\n        [\n            sys.executable,\n            "scripts/build_hf_model_release.py",\n            "--release",\n            "candidate-extra-file",\n            "--output-root",\n            str(release_root),\n        ],\n        check=True,\n    )\n    subprocess.run(\n        [\n            sys.executable,\n            "scripts/hf/prepare_candidate.py",\n            "--release-dir",\n            str(release_root / "candidate-extra-file"),\n            "--output-dir",\n            str(candidate_dir),\n        ],\n        check=True,\n    )\n    (candidate_dir / "unmanifested.bin").write_bytes(b"unexpected")\n    result = subprocess.run(\n        [sys.executable, "scripts/hf/validate_candidate.py", str(candidate_dir)],\n        check=False,\n        capture_output=True,\n        text=True,\n    )\n    assert result.returncode != 0\n    assert "unexpected candidate files" in result.stderr\n'''
          if marker not in text:
              raise SystemExit("candidate test insertion point missing")
          test_path.write_text(text.replace(marker, regression + marker, 1), encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr5-review-fix.yml
          git add .github/workflows/homophone-eval-gpu.yml \
                  .github/workflows/homophone-saturation-gpu.yml \
                  .github/workflows/homophone-context-stress-gpu.yml \
                  tests/test_hf_bucket_storage.py
          git commit -m "fix: preserve GPU evidence and reject unmanifested candidates"
          git push origin "HEAD:${GITHUB_REF_NAME}"
