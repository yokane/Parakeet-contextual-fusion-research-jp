name: devcontainer-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".devcontainer/**"
      - "mise.toml"
      - "mise.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "tools/hf-bucket/**"
      - ".github/workflows/devcontainer-smoke.yml"
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - "mise.toml"
      - "mise.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "tools/hf-bucket/**"
      - ".github/workflows/devcontainer-smoke.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build local development image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --file .devcontainer/Dockerfile \
            --build-arg MISE_VERSION=2026.8.16 \
            --tag jpacf-devcontainer:ci \
            .

      - name: Verify devcontainer bootstrap prerequisites
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm jpacf-devcontainer:ci bash -lc '
            set -euo pipefail
            test "$(uname -m)" = x86_64
            test "$(id -un)" = vscode
            test "$(mise --version | awk "{print \$1}")" = 2026.8.16
            command -v git >/dev/null
            command -v git-lfs >/dev/null
            command -v ffmpeg >/dev/null
            sudo -n true
          '

      - name: Verify full locked post-create bootstrap
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:/src:ro" \
            jpacf-devcontainer:ci bash -lc '
              set -euo pipefail
              sudo mkdir -p /workspaces/repo
              sudo cp -a /src/. /workspaces/repo/
              sudo chown -R "$(id -u):$(id -g)" /workspaces/repo
              cd /workspaces/repo
              bash .devcontainer/post-create.sh
              test "$(python --version 2>&1)" = "Python 3.12.3"
              test "$(uv --version | awk "{print \$2}")" = "0.12.1"
              mise run test
            '
