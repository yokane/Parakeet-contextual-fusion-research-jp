name: maintenance-autofix

on:
  push:
    branches: [fix/model-publish-and-ci]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/model-publish-and-ci
      - name: Apply deterministic source fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          saturation = Path("scripts/analyze_saturation.py")
          text = saturation.read_text(encoding="utf-8")
          text = text.replace(
              "from collections import defaultdict\nfrom pathlib import Path\nfrom typing import Any, Callable\n",
              "from collections import defaultdict\nfrom collections.abc import Callable\nfrom pathlib import Path\nfrom typing import Any\n",
          )
          saturation.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/homophone-eval-gpu.yml")
          text = workflow.read_text(encoding="utf-8")
          text = text.replace(
              "          import json\n          import platform\n",
              "          import json\n          import os\n          import platform\n",
          )
          text = text.replace(
              '          with open("${RESULTS_DIR}/environment.json", "w", encoding="utf-8") as handle:\n',
              '          results_dir = os.environ["RESULTS_DIR"]\n          with open(f"{results_dir}/environment.json", "w", encoding="utf-8") as handle:\n',
          )
          workflow.write_text(text, encoding="utf-8")
          PY
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ruff
          ruff check --fix scripts/analyze_saturation.py
          ruff check scripts/analyze_saturation.py
          bash -n experiments/*.sh
          if git diff --quiet; then
            echo "No maintenance changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/analyze_saturation.py .github/workflows/homophone-eval-gpu.yml
          git commit -m "fix: repair saturation lint and GPU environment capture"
          git push origin HEAD:fix/model-publish-and-ci
