name: maintenance-autofix

on:
  push:
    branches: [fix/model-publish-and-ci]

permissions:
  contents: write

concurrency:
  group: maintenance-autofix
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/model-publish-and-ci
      - name: Apply deterministic source fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/analyze_saturation.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from collections import defaultdict\nfrom pathlib import Path\nfrom typing import Any, Callable\n",
              "from collections import defaultdict\nfrom collections.abc import Callable\nfrom pathlib import Path\nfrom typing import Any\n",
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Verify and commit source-only fix
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ruff
          ruff check --fix scripts/analyze_saturation.py
          ruff check scripts/analyze_saturation.py
          if git diff --quiet -- scripts/analyze_saturation.py; then
            echo "No source change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/analyze_saturation.py
          git commit -m "fix: repair saturation lint"
          git push origin HEAD:fix/model-publish-and-ci
