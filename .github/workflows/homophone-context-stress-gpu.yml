name: homophone-context-stress-gpu

on:
  workflow_dispatch:
    inputs:
      config_name:
        description: "JP-HomophoneBench HF config"
        required: true
        default: "homophone8-audio"
        type: choice
        options: [homophone8-audio, homophone8, homophone8-research]
      split:
        description: "Evaluation split; homophone8-audio publishes test only"
        required: true
        default: "test"
        type: choice
        options: [test, validation]
      pb_alpha:
        description: "Fixed GPU-PB alpha while context distractors vary"
        required: true
        default: "1.0"
        type: string
      distractor_counts:
        description: "Comma-separated added unrelated distractor counts"
        required: true
        default: "0,10,100"
        type: string
      external_distractors_path:
        description: "Optional newline-delimited distractor lexicon path on runner"
        required: false
        default: ""
        type: string
      required_audio_categories:
        description: "Comma-separated categories that must have runnable audio"
        required: true
        default: "exact_homophone,near_homophone"
        type: string
      min_audio_per_category:
        description: "Minimum runnable rows for every required category"
        required: true
        default: "5"
        type: string
      ngpu_lm_path:
        description: "NGPU-LM model path on self-hosted runner"
        required: true
        default: "artifacts/lm/ja-6gram.nemo"
        type: string
      artifact_suffix:
        description: "Result artifact suffix"
        required: true
        default: "context-distractors"
        type: string

permissions:
  contents: read

concurrency:
  group: homophone-context-stress-gpu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: [self-hosted, linux, x64, cuda13]
    timeout-minutes: 300
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_BUCKET: saeeew/J-PACF-YOMI-tdt-bucket
      MANIFEST: data/generated/context-stress/nemo_eval.jsonl
      BENCH_INDEX: data/generated/context-stress/bench_index.jsonl
      NGPU_LM: ${{ inputs.ngpu_lm_path }}
      STRESS_ROOT: results/context-stress
      CONTEXT_ROOT: data/generated/context-stress/lists
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure self-hosted cache contract
        id: cache
        shell: bash
        run: bash scripts/ci/setup_actions_cache.sh

      - name: Install exact mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          install: true
          cache: ${{ steps.cache.outputs.persistent != 'true' }}

      - name: Restore uv and HF caches
        if: ${{ steps.cache.outputs.persistent != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.UV_CACHE_DIR }}
            ${{ env.HF_HUB_CACHE }}
            ${{ env.HF_XET_CACHE }}
          key: jpacf-context-stress-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', 'tools/hf-bucket/uv.lock', 'locks/hf-revisions.lock.json') }}

      - name: Materialize exact GPU and Bucket environments
        shell: bash
        run: |
          set -euo pipefail
          mise run deps:sync-gpu
          mise run hf:transport:sync

      - name: Verify authoritative CUDA13 platform
        run: |
          uv run --locked python scripts/repro/verify_platform.py --require-gpu
          test -f "${NGPU_LM}" || { echo "NGPU-LM file not found: ${NGPU_LM}" >&2; exit 2; }

      - name: Resolve immutable benchmark revision
        id: benchmark
        shell: bash
        run: |
          set -euo pipefail
          revision="$(uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path('locks/hf-revisions.lock.json').read_text(encoding='utf-8'))
          print(lock['repositories']['benchmark']['revision'])
          PY
          )"
          [[ "${revision}" =~ ^[0-9a-f]{40}$ ]] || exit 2
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"

      - name: Rehydrate fixed immutable evaluation set
        run: |
          uv run --locked python scripts/materialize_hf_eval.py \
            --repo-id saeeew/JP-HomophoneBench \
            --revision "${{ steps.benchmark.outputs.revision }}" \
            --config "${{ inputs.config_name }}" \
            --split "${{ inputs.split }}" \
            --output-dir data/generated/context-stress \
            --rehydrate-audio \
            --require-audio
          uv run --locked python scripts/validate_eval_manifest.py "${MANIFEST}" --require-audio

      - name: Enforce acoustic category coverage
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --provenance data/generated/context-stress/eval_provenance.json
            --min-per-category "${{ inputs.min_audio_per_category }}"
            --min-total "${{ inputs.min_audio_per_category }}"
            --output data/generated/context-stress/audio_coverage.json
          )
          IFS=',' read -r -a categories <<< "${{ inputs.required_audio_categories }}"
          for raw in "${categories[@]}"; do
            category="${raw//[[:space:]]/}"
            [[ -z "${category}" ]] || args+=(--required-category "${category}")
          done
          uv run --locked python scripts/validate_audio_coverage.py "${args[@]}"

      - name: Build deterministic nested context lists
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --benchmark "${BENCH_INDEX}"
            --execution-manifest "${MANIFEST}"
            --output-dir "${CONTEXT_ROOT}"
            --distractor-counts "${{ inputs.distractor_counts }}"
            --seed 20260901
          )
          if [[ -n "${{ inputs.external_distractors_path }}" ]]; then
            test -f "${{ inputs.external_distractors_path }}" || {
              echo "External distractor file not found: ${{ inputs.external_distractors_path }}" >&2
              exit 2
            }
            args+=(--external-distractors "${{ inputs.external_distractors_path }}")
          fi
          uv run --locked python scripts/build_context_stress.py "${args[@]}"

      - name: Record stress environment
        shell: bash
        env:
          CONFIG_NAME: ${{ inputs.config_name }}
          SPLIT_NAME: ${{ inputs.split }}
          PB_ALPHA_FIXED: ${{ inputs.pb_alpha }}
          BENCHMARK_REVISION: ${{ steps.benchmark.outputs.revision }}
        run: |
          set -euo pipefail
          mkdir -p "${STRESS_ROOT}"
          uv run --locked python - <<'PY'
          import json
          import os
          import platform
          import subprocess
          from importlib import metadata
          import torch

          lock = json.load(open("locks/hf-revisions.lock.json", encoding="utf-8"))
          report = {
              "git_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "platform_contract": "linux/amd64",
              "cuda_major_contract": 13,
              "python": platform.python_version(),
              "torch": torch.__version__,
              "nemo": metadata.version("nemo-toolkit"),
              "cuda_runtime": torch.version.cuda,
              "gpu": torch.cuda.get_device_name(0),
              "model_revision": lock["repositories"]["base_model"]["revision"],
              "benchmark_revision": os.environ["BENCHMARK_REVISION"],
              "config": os.environ["CONFIG_NAME"],
              "split": os.environ["SPLIT_NAME"],
              "pb_alpha": float(os.environ["PB_ALPHA_FIXED"]),
          }
          path = os.path.join(os.environ["STRESS_ROOT"], "environment.json")
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(report, handle, ensure_ascii=False, indent=2, sort_keys=True)
              handle.write("\n")
          print(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Run E03 distractor-count sweep
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${STRESS_ROOT}"
          : > "${STRESS_ROOT}/result_specs.txt"
          mapfile -t counts < <(
            uv run --locked python - <<'PY'
          import json
          import os
          path = os.path.join(os.environ["CONTEXT_ROOT"], "context_stress_manifest.json")
          with open(path, encoding="utf-8") as handle:
              manifest = json.load(handle)
          for case in manifest["cases"]:
              print(int(case["requested_distractors"]))
          PY
          )
          for count in "${counts[@]}"; do
            label="$(printf '%05d' "${count}")"
            experiment="E03_ctxd_${label}"
            run_dir="${STRESS_ROOT}/${experiment}"
            context_file="${CONTEXT_ROOT}/context_d${label}.txt"
            mkdir -p "${run_dir}"
            test -f "${context_file}"
            echo "Running ${experiment} with $(wc -l < "${context_file}") total phrases"
            RESULTS_DIR="${run_dir}" \
              CONTEXT_PHRASES="${context_file}" \
              PB_ALPHA="${{ inputs.pb_alpha }}" \
              mise run run:e03
            result="${run_dir}/E03_gpu_pb.jsonl"
            test -f "${result}" || { echo "Missing E03 result: ${result}" >&2; exit 2; }
            printf '%s=%s\n' "${experiment}" "${result}" >> "${STRESS_ROOT}/result_specs.txt"
          done

      - name: Collect paired context-stress metrics
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r spec; do
            [[ -z "${spec}" ]] || args+=(--result "${spec}")
          done < "${STRESS_ROOT}/result_specs.txt"
          baseline="$(head -n 1 "${STRESS_ROOT}/result_specs.txt" | cut -d= -f1)"
          uv run --locked python scripts/collect_experiment_metrics.py \
            --benchmark "${BENCH_INDEX}" \
            --execution-manifest "${MANIFEST}" \
            "${args[@]}" \
            --baseline "${baseline}" \
            --parquet "${STRESS_ROOT}/metrics.parquet" \
            --summary "${STRESS_ROOT}/summary.json"

      - name: Analyze context robustness envelope
        run: |
          uv run --locked python scripts/analyze_context_stress.py \
            --metrics "${STRESS_ROOT}/metrics.parquet" \
            --stress-manifest "${CONTEXT_ROOT}/context_stress_manifest.json" \
            --output "${STRESS_ROOT}/context_stress.json" \
            --bootstrap-samples 10000 \
            --confidence 0.95 \
            --max-entity-drop 0.02 \
            --max-fpr-increase 0.02 \
            --max-cer-increase 0.01

      - name: Persist immutable context-stress run to HF Bucket
        shell: bash
        run: |
          set -euo pipefail
          run_id="gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-context-stress"
          run_dir="dist/hf-runs/${run_id}"
          uv run --locked python scripts/hf/build_run_bundle.py \
            --results-dir "${STRESS_ROOT}" \
            --output-dir "${run_dir}" \
            --run-id "${run_id}" \
            --workflow-kind homophone-context-stress \
            --benchmark-index "${BENCH_INDEX}" \
            --execution-manifest "${MANIFEST}"
          bash scripts/hf/hf-push-run.sh "${run_dir}"
          echo "HF Bucket run: hf://buckets/${HF_BUCKET}/runs/${run_id}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload context-stress artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homophone-context-stress-${{ inputs.artifact_suffix }}-${{ inputs.config_name }}-${{ inputs.split }}
          path: |
            data/generated/context-stress/eval_provenance.json
            data/generated/context-stress/audio_coverage.json
            data/generated/context-stress/bench_index.jsonl
            data/generated/context-stress/nemo_eval.jsonl
            data/generated/context-stress/lists
            results/context-stress
          if-no-files-found: error
          retention-days: 30
