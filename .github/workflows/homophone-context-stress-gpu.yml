name: homophone-context-stress-gpu

on:
  workflow_dispatch:
    inputs:
      config_name:
        description: "JP-HomophoneBench HF config"
        required: true
        default: "homophone8-research"
        type: choice
        options: [homophone8, homophone8-research]
      split:
        description: "Evaluation split"
        required: true
        default: "test"
        type: choice
        options: [test, validation]
      pb_alpha:
        description: "Fixed GPU-PB alpha while context distractors vary"
        required: true
        default: "1.0"
        type: string
      distractor_counts:
        description: "Comma-separated added unrelated distractor counts"
        required: true
        default: "0,10,100"
        type: string
      external_distractors_path:
        description: "Optional newline-delimited distractor lexicon path on runner"
        required: false
        default: ""
        type: string
      required_audio_categories:
        description: "Comma-separated categories that must have runnable audio"
        required: true
        default: "exact_homophone,near_homophone"
        type: string
      min_audio_per_category:
        description: "Minimum runnable rows for every required category"
        required: true
        default: "5"
        type: string
      ngpu_lm_path:
        description: "NGPU-LM model path on self-hosted runner"
        required: true
        default: "artifacts/lm/ja-6gram.nemo"
        type: string
      artifact_suffix:
        description: "Result artifact suffix"
        required: true
        default: "context-distractors"
        type: string

permissions:
  contents: read

concurrency:
  group: homophone-context-stress-gpu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 300
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MODEL_NAME: nvidia/parakeet-tdt_ctc-0.6b-ja
      NEMO_ROOT: /opt/NeMo
      MANIFEST: data/generated/context-stress/nemo_eval.jsonl
      BENCH_INDEX: data/generated/context-stress/bench_index.jsonl
      NGPU_LM: ${{ inputs.ngpu_lm_path }}
      STRESS_ROOT: results/context-stress
      CONTEXT_ROOT: data/generated/context-stress/lists
    steps:
      - uses: actions/checkout@v4

      - name: Check GPU and NeMo environment
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          test -f "${NEMO_ROOT}/examples/asr/speech_to_text_eval.py"
          test -f "${NGPU_LM}" || { echo "NGPU-LM file not found: ${NGPU_LM}" >&2; exit 2; }
          python - <<'PY'
          import nemo
          import torch

          print("nemo", getattr(nemo, "__version__", "unknown"))
          print("torch", torch.__version__)
          print("cuda", torch.cuda.is_available())
          if not torch.cuda.is_available():
              raise SystemExit("CUDA is not available")
          PY

      - name: Install evaluation dependencies
        run: |
          python -m pip install 'datasets>=4,<5' 'huggingface-hub>=0.34,<2' soundfile pyarrow
          python -m pip install --no-deps -e .

      - name: Rehydrate fixed evaluation set
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_hf_eval.py \
            --repo-id saeeew/JP-HomophoneBench \
            --config "${{ inputs.config_name }}" \
            --split "${{ inputs.split }}" \
            --output-dir data/generated/context-stress \
            --rehydrate-audio \
            --require-audio
          python scripts/validate_eval_manifest.py "${MANIFEST}" --require-audio

      - name: Enforce acoustic category coverage
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --provenance data/generated/context-stress/eval_provenance.json
            --min-per-category "${{ inputs.min_audio_per_category }}"
            --min-total "${{ inputs.min_audio_per_category }}"
            --output data/generated/context-stress/audio_coverage.json
          )
          IFS=',' read -r -a categories <<< "${{ inputs.required_audio_categories }}"
          for raw in "${categories[@]}"; do
            category="${raw//[[:space:]]/}"
            [[ -z "${category}" ]] || args+=(--required-category "${category}")
          done
          python scripts/validate_audio_coverage.py "${args[@]}"

      - name: Build deterministic nested context lists
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --benchmark "${BENCH_INDEX}"
            --execution-manifest "${MANIFEST}"
            --output-dir "${CONTEXT_ROOT}"
            --distractor-counts "${{ inputs.distractor_counts }}"
            --seed 20260901
          )
          if [[ -n "${{ inputs.external_distractors_path }}" ]]; then
            test -f "${{ inputs.external_distractors_path }}" || {
              echo "External distractor file not found: ${{ inputs.external_distractors_path }}" >&2
              exit 2
            }
            args+=(--external-distractors "${{ inputs.external_distractors_path }}")
          fi
          python scripts/build_context_stress.py "${args[@]}"

      - name: Record stress environment
        shell: bash
        env:
          CONFIG_NAME: ${{ inputs.config_name }}
          SPLIT_NAME: ${{ inputs.split }}
          PB_ALPHA_FIXED: ${{ inputs.pb_alpha }}
        run: |
          set -euo pipefail
          mkdir -p "${STRESS_ROOT}"
          python - <<'PY'
          import json
          import os
          import platform
          import subprocess

          import nemo
          import torch

          report = {
              "git_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "python": platform.python_version(),
              "torch": torch.__version__,
              "nemo": getattr(nemo, "__version__", "unknown"),
              "cuda_runtime": torch.version.cuda,
              "gpu": torch.cuda.get_device_name(0),
              "config": os.environ["CONFIG_NAME"],
              "split": os.environ["SPLIT_NAME"],
              "pb_alpha": os.environ["PB_ALPHA_FIXED"],
          }
          path = os.path.join(os.environ["STRESS_ROOT"], "environment.json")
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(report, handle, ensure_ascii=False, indent=2, sort_keys=True)
              handle.write("\n")
          print(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Run E03 distractor-count sweep
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${STRESS_ROOT}"
          : > "${STRESS_ROOT}/result_specs.txt"
          mapfile -t counts < <(
            python - <<'PY'
          import json
          import os

          path = os.path.join(os.environ["CONTEXT_ROOT"], "context_stress_manifest.json")
          with open(path, encoding="utf-8") as handle:
              manifest = json.load(handle)
          for case in manifest["cases"]:
              print(int(case["requested_distractors"]))
          PY
          )
          for count in "${counts[@]}"; do
            label="$(printf '%05d' "${count}")"
            experiment="E03_ctxd_${label}"
            run_dir="${STRESS_ROOT}/${experiment}"
            context_file="${CONTEXT_ROOT}/context_d${label}.txt"
            mkdir -p "${run_dir}"
            test -f "${context_file}"
            echo "Running ${experiment} with $(wc -l < "${context_file}") total phrases"
            RESULTS_DIR="${run_dir}" \
              CONTEXT_PHRASES="${context_file}" \
              PB_ALPHA="${{ inputs.pb_alpha }}" \
              bash experiments/E03_gpu_pb.sh
            result="${run_dir}/E03_gpu_pb.json"
            test -f "${result}" || { echo "Missing E03 result: ${result}" >&2; exit 2; }
            printf '%s=%s\n' "${experiment}" "${result}" >> "${STRESS_ROOT}/result_specs.txt"
          done

      - name: Collect paired context-stress metrics
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r spec; do
            [[ -z "${spec}" ]] || args+=(--result "${spec}")
          done < "${STRESS_ROOT}/result_specs.txt"
          baseline="$(head -n 1 "${STRESS_ROOT}/result_specs.txt" | cut -d= -f1)"
          python scripts/collect_experiment_metrics.py \
            --benchmark "${BENCH_INDEX}" \
            --execution-manifest "${MANIFEST}" \
            "${args[@]}" \
            --baseline "${baseline}" \
            --parquet "${STRESS_ROOT}/metrics.parquet" \
            --summary "${STRESS_ROOT}/summary.json"

      - name: Analyze context robustness envelope
        run: |
          python scripts/analyze_context_stress.py \
            --metrics "${STRESS_ROOT}/metrics.parquet" \
            --stress-manifest "${CONTEXT_ROOT}/context_stress_manifest.json" \
            --output "${STRESS_ROOT}/context_stress.json" \
            --bootstrap-samples 10000 \
            --confidence 0.95 \
            --max-entity-drop 0.02 \
            --max-fpr-increase 0.02 \
            --max-cer-increase 0.01

      - name: Upload context-stress artifact
        uses: actions/upload-artifact@v4
        with:
          name: homophone-context-stress-${{ inputs.artifact_suffix }}-${{ inputs.config_name }}-${{ inputs.split }}
          path: |
            data/generated/context-stress/eval_provenance.json
            data/generated/context-stress/audio_coverage.json
            data/generated/context-stress/bench_index.jsonl
            data/generated/context-stress/nemo_eval.jsonl
            data/generated/context-stress/lists
            results/context-stress
          if-no-files-found: error
          retention-days: 30
