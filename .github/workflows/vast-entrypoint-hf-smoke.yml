name: vast-entrypoint-hf-smoke

on:
  workflow_dispatch:
  push:
    branches: [feat/portable-ghcr-gpu-runtime]
    paths:
      - ".github/workflows/vast-entrypoint-hf-smoke.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: vast-entrypoint-hf-smoke-${{ github.ref }}
  cancel-in-progress: false

env:
  RUNTIME_IMAGE: ghcr.io/yokane/jpacf-yomi-tdt-runtime@sha256:df3140308992bfb0fc5b84cae6dfbbe6e388709725e9aa0810329965c91ba2ad
  HF_BUCKET: saeeew/J-PACF-YOMI-tdt-bucket
  STORAGE_GB: "50"
  GPU_RAM_GB: "24"
  GPU_ALLOWLIST: RTX_4090
  MIN_INET_DOWN_MBPS: "1000"
  MIN_RELIABILITY: "0.98"
  STARTUP_MAX_ATTEMPTS: "360"
  RELAY_PORT: "8081"
  PREDICTED_MINUTES: "20"
  MAX_COST_USD: "0.50"
  OFFER_LIMIT: "50"

jobs:
  vast-entrypoint-to-hf:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GHCR_TOKEN: ${{ github.token }}
      SMOKE_RUN_KEY: vast-entrypoint-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      VAST_LABEL: jpacf-entrypoint-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install exact mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          install: true
          cache: true

      - name: Materialize locked Vast and HF transport environments
        shell: bash
        run: |
          set -euo pipefail
          mise run deps:sync-vast
          mise run hf:transport:sync
          command -v jq >/dev/null

      - name: Validate immutable contract and HF Bucket before spend
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VAST_API_KEY:-}"
          test -n "${HF_TOKEN:-}"
          test -n "${GHCR_TOKEN:-}"
          [[ "$RUNTIME_IMAGE" =~ ^ghcr\.io/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@sha256:[0-9a-f]{64}$ ]]
          mkdir -p dist/vast-entrypoint
          probe="dist/vast-entrypoint/hf-preflight.txt"
          roundtrip="dist/vast-entrypoint/hf-preflight-roundtrip.txt"
          remote="hf://buckets/${HF_BUCKET}/_auth-probe/vast-entrypoint/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          printf 'run=%s\nattempt=%s\nsha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > "$probe"
          source scripts/hf/hf-identity.sh
          hf_bucket_cli buckets cp "$probe" "$remote" --token "$HF_TOKEN"
          hf_bucket_cli buckets cp "$remote" "$roundtrip" --token "$HF_TOKEN"
          cmp "$probe" "$roundtrip"
          hf_bucket_cli buckets rm "$remote" -y --token "$HF_TOKEN"

      - name: Select fastest budget-compliant on-demand RTX 4090
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/providers
          uv run --locked python scripts/providers/vast/build_search_query.py \
            --gpu-name "$GPU_ALLOWLIST" \
            --num-gpus 1 \
            --gpu-ram ">=${GPU_RAM_GB}" \
            --inet-down ">=${MIN_INET_DOWN_MBPS}" \
            --reliability ">=${MIN_RELIABILITY}" \
            --output-json dist/providers/vast-entrypoint-search-query.json \
            > dist/providers/vast-entrypoint-search-query.txt
          query="$(cat dist/providers/vast-entrypoint-search-query.txt)"
          uv run --locked vastai search offers \
            --api-key "$VAST_API_KEY" \
            --raw --no-default --type on-demand \
            --order 'inet_down-,dph_total' \
            --storage "$STORAGE_GB" --limit "$OFFER_LIMIT" \
            "$query" > dist/providers/vast-entrypoint-raw.json
          uv run --locked python scripts/providers/vast/rank_offers.py \
            --input dist/providers/vast-entrypoint-raw.json \
            --predicted-minutes "$PREDICTED_MINUTES" \
            --max-cost-usd "$MAX_COST_USD" \
            --min-inet-down-mbps "$MIN_INET_DOWN_MBPS" \
            --output dist/providers/vast-entrypoint-inventory.json \
            > dist/providers/vast-entrypoint-inventory.md
          cat dist/providers/vast-entrypoint-inventory.md >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('dist/providers/vast-entrypoint-inventory.json').read_text())
          offers = [row for row in payload.get('offers', []) if not row.get('is_bid')]
          if not offers:
              raise SystemExit('no budget-compliant fast on-demand offer')
          selected = max(offers, key=lambda row: (float(row.get('inet_down_mbps') or 0), -float(row.get('dph_total') or 999)))
          Path('dist/providers/vast-entrypoint-selected.json').write_text(json.dumps(selected, indent=2, sort_keys=True) + '\n')
          with open('/tmp/vast-entrypoint.env', 'w') as handle:
              handle.write(f"VAST_OFFER_ID={selected['offer_id']}\n")
              handle.write(f"VAST_GPU_NAME={selected['gpu_name']}\n")
              handle.write(f"VAST_DPH_TOTAL={selected['dph_total']}\n")
              handle.write(f"VAST_PREDICTED_COST={selected['predicted_cost_usd']}\n")
              handle.write(f"VAST_INET_DOWN={selected['inet_down_mbps']}\n")
          PY
          cat /tmp/vast-entrypoint.env >> "$GITHUB_ENV"

      - name: Build one-time GPU evidence relay payload
        shell: bash
        run: |
          set -euo pipefail
          relay_token="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::${relay_token}"
          echo "JPA_CF_RELAY_TOKEN=${relay_token}" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/vast-entrypoint-smoke.sh" <<'REMOTE'
          #!/usr/bin/env bash
          set -euo pipefail
          export JPA_CF_CONTAINER_RUNTIME=1
          work=/workspace/state/artifacts/vast-entrypoint-smoke
          rm -rf "$work"
          mkdir -p "$work"
          python /opt/jpacf/scripts/container/verify_runtime.py --require-gpu > "$work/runtime-verify.txt"
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import platform
          import socket
          import subprocess
          from pathlib import Path
          import torch
          if not torch.cuda.is_available():
              raise SystemExit('CUDA unavailable')
          tensor = torch.arange(16, device='cuda', dtype=torch.float32)
          checksum = float((tensor * tensor).sum().item())
          smi = subprocess.check_output(
              ['nvidia-smi', '--query-gpu=name,driver_version,memory.total', '--format=csv,noheader,nounits'],
              text=True,
          ).strip().splitlines()[0]
          gpu_name, driver_version, memory_mib = [part.strip() for part in smi.split(',', 2)]
          result = {
              'schema_version': 2,
              'provider': 'vast',
              'transport': 'entrypoint-http-relay',
              'run_key': os.environ['SMOKE_RUN_KEY'],
              'vast_label': os.environ['VAST_LABEL'],
              'offer_id': int(os.environ['VAST_OFFER_ID']),
              'expected_image': os.environ['EXPECTED_IMAGE'],
              'source_git_sha': os.environ['SOURCE_GIT_SHA'],
              'hostname': socket.gethostname(),
              'platform': platform.platform(),
              'gpu_name': gpu_name,
              'driver_version': driver_version,
              'gpu_memory_mib': int(memory_mib),
              'torch': torch.__version__,
              'torch_cuda': torch.version.cuda,
              'cuda_available': True,
              'cuda_device_count': torch.cuda.device_count(),
              'cuda_tensor_checksum': checksum,
              'created_at_utc': dt.datetime.now(dt.timezone.utc).isoformat(),
          }
          Path('/workspace/state/artifacts/vast-entrypoint-smoke/result.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )
          PY
          printf '%s\n' "$SMOKE_RUN_KEY" > "$work/_SUCCESS"
          python - <<'PY'
          import hmac
          import os
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          root = Path('/workspace/state/artifacts/vast-entrypoint-smoke')
          token = os.environ['JPA_CF_RELAY_TOKEN']
          port = int(os.environ['JPA_CF_RELAY_PORT'])
          files = {
              '/runtime-verify.txt': root / 'runtime-verify.txt',
              '/result.json': root / 'result.json',
              '/_SUCCESS': root / '_SUCCESS',
          }
          class Handler(BaseHTTPRequestHandler):
              def authorized(self):
                  return hmac.compare_digest(self.headers.get('Authorization', ''), f'Bearer {token}')
              def do_GET(self):
                  if not self.authorized():
                      self.send_response(401); self.end_headers(); return
                  if self.path == '/health':
                      body = b'ready\n'
                  else:
                      path = files.get(self.path)
                      if path is None or not path.is_file():
                          self.send_response(404); self.end_headers(); return
                      body = path.read_bytes()
                  self.send_response(200)
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, fmt, *args):
                  return
          ThreadingHTTPServer(('0.0.0.0', port), Handler).serve_forever()
          PY
          REMOTE
          sha256sum "$RUNNER_TEMP/vast-entrypoint-smoke.sh" > dist/vast-entrypoint/relay-script.sha256
          echo "VAST_HEADLESS_SCRIPT_B64=$(base64 -w0 "$RUNNER_TEMP/vast-entrypoint-smoke.sh")" >> "$GITHUB_ENV"

      - name: Create Vast instance in args/entrypoint mode
        shell: bash
        run: |
          set -euo pipefail
          docker_env="-p ${RELAY_PORT}:${RELAY_PORT} -e JPA_CF_RELAY_PORT=${RELAY_PORT} -e JPA_CF_RELAY_TOKEN=${JPA_CF_RELAY_TOKEN} -e VAST_HEADLESS_SCRIPT_B64=${VAST_HEADLESS_SCRIPT_B64} -e SMOKE_RUN_KEY=${SMOKE_RUN_KEY} -e VAST_LABEL=${VAST_LABEL} -e VAST_OFFER_ID=${VAST_OFFER_ID} -e EXPECTED_IMAGE=${RUNTIME_IMAGE} -e SOURCE_GIT_SHA=${GITHUB_SHA}"
          response="$(uv run --locked vastai create instance "$VAST_OFFER_ID" \
            --api-key "$VAST_API_KEY" --raw \
            --image "$RUNTIME_IMAGE" --disk "$STORAGE_GB" --label "$VAST_LABEL" \
            --login "-u ${GITHUB_ACTOR} -p ${GHCR_TOKEN} ghcr.io" \
            --env "$docker_env" --cancel-unavail \
            --args /bin/bash -lc 'echo "$VAST_HEADLESS_SCRIPT_B64" | base64 -d | bash')"
          printf '%s\n' "$response" > dist/vast-entrypoint/create-response.json
          instance_id="$(python -c "import json; print(int(json.load(open('dist/vast-entrypoint/create-response.json'))['new_contract']))")"
          printf '%s\n' "$instance_id" > "$RUNNER_TEMP/vast-instance-id"
          echo "VAST_INSTANCE_ID=$instance_id" >> "$GITHUB_ENV"

      - name: Wait for pull and authenticated relay
        shell: bash
        run: |
          set -euo pipefail
          status_path="$RUNNER_TEMP/vast-status.json"
          : > dist/vast-entrypoint/instance-status.jsonl
          ready=0
          for attempt in $(seq 1 "$STARTUP_MAX_ATTEMPTS"); do
            raw="$(uv run --locked vastai show instance "$VAST_INSTANCE_ID" --api-key "$VAST_API_KEY" --raw 2>/dev/null || true)"
            if [[ -n "$raw" ]]; then
              printf '%s\n' "$raw" > "$status_path"
              snapshot="$(python - "$attempt" "$RELAY_PORT" "$status_path" <<'PY'
          import json, sys
          from pathlib import Path
          row = json.loads(Path(sys.argv[3]).read_text())
          ports = row.get('ports', {}).get(f'{sys.argv[2]}/tcp') or []
          if isinstance(ports, dict):
              ports = [ports]
          external = ''
          for item in ports:
              if isinstance(item, dict) and item.get('HostPort'):
                  external = str(item['HostPort'])
                  break
          status = str(row.get('status_msg') or '')
          status = ' | '.join(part.strip() for part in status.splitlines() if part.strip())
          print(json.dumps({
              'attempt': int(sys.argv[1]),
              'actual_status': row.get('actual_status') or '',
              'status_msg': status,
              'dph_total': row.get('dph_total'),
              'inet_down': row.get('inet_down'),
              'public_ipaddr': row.get('public_ipaddr') or '',
              'relay_external_port': external,
          }, sort_keys=True))
          PY
              )"
              printf '%s\n' "$snapshot" >> dist/vast-entrypoint/instance-status.jsonl
              printf '%s\n' "$snapshot" > dist/vast-entrypoint/instance-status-latest.json
              actual="$(jq -r '.actual_status' <<<"$snapshot")"
              status_msg="$(jq -r '.status_msg' <<<"$snapshot")"
              actual_dph="$(jq -r '.dph_total // empty' <<<"$snapshot")"
              relay_host="$(jq -r '.public_ipaddr' <<<"$snapshot")"
              relay_external_port="$(jq -r '.relay_external_port' <<<"$snapshot")"
              if [[ "$actual" =~ ^(exited|offline|stopped)$ ]]; then
                echo "terminal Vast status: $actual: $status_msg" >&2
                exit 1
              fi
              if [[ "$actual" == running && -n "$actual_dph" ]]; then
                python - "$VAST_DPH_TOTAL" "$actual_dph" <<'PY'
          import math, sys
          quoted, actual = map(float, sys.argv[1:])
          if not math.isclose(quoted, actual, rel_tol=0.08, abs_tol=0.02):
              raise SystemExit(f'price mismatch quoted={quoted:.6f} actual={actual:.6f}')
          PY
              fi
              if [[ "$actual" == running && -n "$relay_host" && -n "$relay_external_port" ]]; then
                relay_base="http://${relay_host}:${relay_external_port}"
                if [[ "$(curl -fsS --connect-timeout 5 --max-time 10 -H "Authorization: Bearer ${JPA_CF_RELAY_TOKEN}" "${relay_base}/health" 2>/dev/null || true)" == ready ]]; then
                  echo "VAST_RELAY_BASE=$relay_base" >> "$GITHUB_ENV"
                  printf '%s\n' "$relay_base" > dist/vast-entrypoint/relay-endpoint.txt
                  ready=1
                  break
                fi
              fi
              echo "Vast not ready ${attempt}/${STARTUP_MAX_ATTEMPTS}: ${actual:-unknown}: ${status_msg:-none}"
            fi
            sleep 5
          done
          [[ "$ready" == 1 ]] || { tail -30 dist/vast-entrypoint/instance-status.jsonl >&2; exit 1; }

      - name: Relay GPU evidence through GitHub runner and HF Bucket
        shell: bash
        run: |
          set -euo pipefail
          source_dir=dist/vast-entrypoint/from-vast
          verify_dir=dist/vast-entrypoint/from-hf
          mkdir -p "$source_dir" "$verify_dir"
          for name in runtime-verify.txt result.json _SUCCESS; do
            curl -fsS --retry 3 --connect-timeout 10 --max-time 60 \
              -H "Authorization: Bearer ${JPA_CF_RELAY_TOKEN}" \
              "${VAST_RELAY_BASE}/${name}" -o "$source_dir/$name"
          done
          grep -Fx "$SMOKE_RUN_KEY" "$source_dir/_SUCCESS"
          source scripts/hf/hf-identity.sh
          remote="hf://buckets/${HF_BUCKET}/runs/${SMOKE_RUN_KEY}/vast-entrypoint-smoke"
          for name in runtime-verify.txt result.json _SUCCESS; do
            hf_bucket_cli buckets cp "$source_dir/$name" "$remote/$name" --token "$HF_TOKEN"
            hf_bucket_cli buckets cp "$remote/$name" "$verify_dir/$name" --token "$HF_TOKEN"
            cmp "$source_dir/$name" "$verify_dir/$name"
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path('dist/vast-entrypoint/from-hf/result.json').read_text())
          assert result['provider'] == 'vast'
          assert result['transport'] == 'entrypoint-http-relay'
          assert result['run_key'] == os.environ['SMOKE_RUN_KEY']
          assert result['expected_image'] == os.environ['RUNTIME_IMAGE']
          assert result['source_git_sha'] == os.environ['GITHUB_SHA']
          assert result['gpu_name'] == 'NVIDIA GeForce RTX 4090'
          assert result['cuda_available'] is True
          assert result['cuda_device_count'] >= 1
          assert result['cuda_tensor_checksum'] == 1240.0
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
          {
            echo '### Vast entrypoint cold-start smoke'
            echo "- offer: ${VAST_OFFER_ID}"
            echo "- advertised download: ${VAST_INET_DOWN} Mbps"
            echo "- on-demand rate: \$${VAST_DPH_TOTAL}/h"
            echo "- predicted 20 min running cost: \$${VAST_PREDICTED_COST}"
            echo '- launch mode: args/entrypoint (no Vast SSH/Jupyter injection)'
            echo '- artifact transport: one-time bearer HTTP → GitHub runner → HF Bucket'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture sanitized failure evidence
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          if [[ -s "$RUNNER_TEMP/vast-instance-id" ]]; then
            id="$(cat "$RUNNER_TEMP/vast-instance-id")"
            raw="$(uv run --locked vastai show instance "$id" --api-key "$VAST_API_KEY" --raw 2>/dev/null)"
            printf '%s' "$raw" | python -c 'import json,sys; r=json.load(sys.stdin); [r.pop(k,None) for k in ("extra_env","env","image_login","login")]; print(json.dumps(r,indent=2,sort_keys=True))' > dist/vast-entrypoint/instance-failure.json 2>/dev/null || true
            uv run --locked vastai logs "$id" --api-key "$VAST_API_KEY" --tail 300 > dist/vast-entrypoint/container.log 2>&1 || true
          fi

      - name: Destroy Vast instance
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          if [[ -s "$RUNNER_TEMP/vast-instance-id" ]]; then
            id="$(cat "$RUNNER_TEMP/vast-instance-id")"
            uv run --locked vastai destroy instance "$id" --api-key "$VAST_API_KEY" -y || true
          fi

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vast-entrypoint-hf-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/providers/vast-entrypoint-*
            dist/vast-entrypoint/
          if-no-files-found: warn
          retention-days: 30
