name: homophone-eval-gpu

on:
  workflow_dispatch:
    inputs:
      config_name:
        description: "JP-HomophoneBench HF config"
        required: true
        default: "homophone8-audio"
        type: choice
        options: [homophone8-audio, homophone8, homophone8-research]
      split:
        description: "Evaluation split; homophone8-audio publishes test only"
        required: true
        default: "test"
        type: choice
        options: [test, validation]
      experiments:
        description: "Comma-separated E00..E06; E04+ need their prerequisite artifacts"
        required: true
        default: "E00,E01"
        type: string
      ngpu_lm_path:
        description: "NGPU-LM .nemo/.arpa path on the runner"
        required: true
        default: "artifacts/lm/ja-6gram.nemo"
        type: string
      results_name:
        description: "Artifact suffix"
        required: true
        default: "manual"
        type: string

permissions:
  contents: read

concurrency:
  group: homophone-eval-gpu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: [self-hosted, linux, x64, cuda13]
    timeout-minutes: 240
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_BUCKET: saeeew/J-PACF-YOMI-tdt-bucket
      MANIFEST: data/generated/eval/nemo_eval.jsonl
      BENCH_INDEX: data/generated/eval/bench_index.jsonl
      CONTEXT_PHRASES: data/generated/eval/context_phrases.txt
      NGPU_LM: ${{ inputs.ngpu_lm_path }}
      RESULTS_DIR: results/${{ inputs.results_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure self-hosted cache contract
        id: cache
        shell: bash
        run: bash scripts/ci/setup_actions_cache.sh

      - name: Install exact mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          install: true
          cache: ${{ steps.cache.outputs.persistent != 'true' }}

      - name: Restore uv and HF caches
        if: ${{ steps.cache.outputs.persistent != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.UV_CACHE_DIR }}
            ${{ env.HF_HUB_CACHE }}
            ${{ env.HF_XET_CACHE }}
          key: jpacf-gpu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', 'tools/hf-bucket/uv.lock', 'locks/hf-revisions.lock.json') }}

      - name: Materialize exact NeMo CUDA13 environment
        run: mise run deps:sync-gpu

      - name: Materialize isolated HF Bucket transport
        run: mise run hf:transport:sync

      - name: Verify authoritative GPU research platform
        run: uv run --locked python scripts/repro/verify_platform.py --require-gpu

      - name: Resolve immutable benchmark revision
        id: benchmark
        shell: bash
        run: |
          revision="$(uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path('locks/hf-revisions.lock.json').read_text(encoding='utf-8'))
          print(lock['repositories']['benchmark']['revision'])
          PY
          )"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || exit 2
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Rehydrate immutable benchmark audio
        run: |
          uv run --locked python scripts/materialize_hf_eval.py \
            --repo-id saeeew/JP-HomophoneBench \
            --revision "${{ steps.benchmark.outputs.revision }}" \
            --config "${{ inputs.config_name }}" \
            --split "${{ inputs.split }}" \
            --output-dir data/generated/eval \
            --rehydrate-audio \
            --require-audio
          uv run --locked python scripts/validate_eval_manifest.py "${MANIFEST}" --require-audio

      - name: Enforce exact and near acoustic coverage
        run: |
          uv run --locked python scripts/validate_audio_coverage.py \
            --provenance data/generated/eval/eval_provenance.json \
            --required-category exact_homophone \
            --required-category near_homophone \
            --min-per-category 5 \
            --min-total 10 \
            --output data/generated/eval/audio_coverage.json

      - name: Record reproducibility environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RESULTS_DIR}"
          uv run --locked python - <<'PY'
          import json
          import os
          import platform
          import subprocess
          from importlib import metadata
          import torch

          def command(*args):
              return subprocess.check_output(args, text=True).strip()

          lock = json.load(open("locks/hf-revisions.lock.json", encoding="utf-8"))
          report = {
              "git_sha": command("git", "rev-parse", "HEAD"),
              "platform_contract": "linux/amd64",
              "cuda_major_contract": 13,
              "python": platform.python_version(),
              "torch": torch.__version__,
              "nemo": metadata.version("nemo-toolkit"),
              "cuda_runtime": torch.version.cuda,
              "gpu": torch.cuda.get_device_name(0),
              "base_model_revision": lock["repositories"]["base_model"]["revision"],
              "benchmark_revision": lock["repositories"]["benchmark"]["revision"],
          }
          results_dir = os.environ["RESULTS_DIR"]
          with open(f"{results_dir}/environment.json", "w", encoding="utf-8") as handle:
              json.dump(report, handle, ensure_ascii=False, indent=2, sort_keys=True)
              handle.write("\n")
          print(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Run selected experiments through mise jobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RESULTS_DIR}"
          IFS=',' read -r -a selected <<< "${{ inputs.experiments }}"
          for experiment in "${selected[@]}"; do
            experiment="${experiment//[[:space:]]/}"
            case "${experiment}" in
              E00) mise run run:e00 ;;
              E01) mise run run:e01 ;;
              E02) mise run run:e02 ;;
              E03) mise run run:e03 ;;
              E04) mise run run:e04 ;;
              E05) mise run run:e05 ;;
              E06) mise run run:e06 ;;
              *) echo "Unknown experiment: ${experiment}" >&2; exit 2 ;;
            esac
          done

      - name: Collect category-aware metrics
        shell: bash
        run: |
          set -euo pipefail
          args=()
          IFS=',' read -r -a selected <<< "${{ inputs.experiments }}"
          for experiment in "${selected[@]}"; do
            experiment="${experiment//[[:space:]]/}"
            case "${experiment}" in
              E00) path="${RESULTS_DIR}/E00_tdt_greedy.jsonl" ;;
              E01) path="${RESULTS_DIR}/E01_tdt_beam.jsonl" ;;
              E02) path="${RESULTS_DIR}/E02_ngpulm.jsonl" ;;
              E03) path="${RESULTS_DIR}/E03_gpu_pb.jsonl" ;;
              E04) path="${RESULTS_DIR}/E04_ctc_rerank.jsonl" ;;
              E05) path="${RESULTS_DIR}/E05_phone_rerank.jsonl" ;;
              E06) path="${RESULTS_DIR}/E06_inbeam.jsonl" ;;
              *) continue ;;
            esac
            test -f "${path}" || { echo "Missing experiment result: ${path}" >&2; exit 2; }
            args+=(--result "${experiment}=${path}")
          done
          uv run --locked python scripts/collect_experiment_metrics.py \
            --benchmark "${BENCH_INDEX}" \
            --execution-manifest "${MANIFEST}" \
            "${args[@]}" \
            --parquet "${RESULTS_DIR}/metrics.parquet" \
            --summary "${RESULTS_DIR}/summary.json"

      - name: Persist immutable run evidence to HF Bucket
        shell: bash
        run: |
          set -euo pipefail
          run_id="gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-eval"
          run_dir="dist/hf-runs/${run_id}"
          uv run --locked python scripts/hf/build_run_bundle.py \
            --results-dir "${RESULTS_DIR}" \
            --output-dir "${run_dir}" \
            --run-id "${run_id}" \
            --workflow-kind homophone-eval \
            --benchmark-index "${BENCH_INDEX}" \
            --execution-manifest "${MANIFEST}"
          bash scripts/hf/hf-push-run.sh "${run_dir}"
          echo "HF Bucket run: hf://buckets/${HF_BUCKET}/runs/${run_id}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload experiment artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homophone-eval-${{ inputs.results_name }}-${{ inputs.config_name }}-${{ inputs.split }}-${{ github.sha }}
          path: |
            data/generated/eval/eval_provenance.json
            data/generated/eval/audio_coverage.json
            data/generated/eval/bench_index.jsonl
            data/generated/eval/nemo_eval.jsonl
            data/generated/eval/context_phrases.txt
            ${{ env.RESULTS_DIR }}
          if-no-files-found: error
          retention-days: 30
