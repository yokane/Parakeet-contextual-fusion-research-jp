name: vast-inspect-current

on:
  push:
    branches: [feat/portable-ghcr-gpu-runtime]
    paths:
      - ".github/workflows/vast-inspect-current.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      TARGET_LABEL: jpacf-runtime-diag-33551730554-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install exact mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          install: true
          cache: true

      - name: Materialize Vast CLI environment
        shell: bash
        run: |
          set -euo pipefail
          mise run deps:sync-vast
          test -n "${VAST_API_KEY:-}"

      - name: Inspect active diagnostic instance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/vast-inspect
          uv run --locked vastai show instances --api-key "$VAST_API_KEY" --raw > "$RUNNER_TEMP/vast-instances.json"
          python - "$TARGET_LABEL" "$RUNNER_TEMP/vast-instances.json" <<'PY' > dist/vast-inspect/instance.json
          import json, sys
          from pathlib import Path
          payload=json.loads(Path(sys.argv[2]).read_text())
          rows=payload if isinstance(payload, list) else payload.get('instances', [])
          matches=[row for row in rows if str(row.get('label') or '') == sys.argv[1]]
          if not matches:
              raise SystemExit(f'no active Vast instance with label {sys.argv[1]!r}')
          row=matches[0]
          safe={key: row.get(key) for key in (
              'id','label','actual_status','status_msg','gpu_name','gpu_ram','dph_total',
              'inet_down','inet_down_cost','disk_space','duration','start_date','public_ipaddr'
          )}
          print(json.dumps(safe, indent=2, sort_keys=True))
          PY
          cat dist/vast-inspect/instance.json
          id="$(python -c "import json; print(int(json.load(open('dist/vast-inspect/instance.json'))['id']))")"
          uv run --locked vastai logs "$id" --api-key "$VAST_API_KEY" --tail 3000 > dist/vast-inspect/container.log 2>&1 || true
          echo '=== Vast container log ==='
          cat dist/vast-inspect/container.log

      - name: Upload inspection evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vast-inspect-current-${{ github.run_id }}
          path: dist/vast-inspect/
          if-no-files-found: warn
          retention-days: 3
