name: jp-homophone-hf-publish

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Immutable release directory name"
        required: true
        default: "v0.1.0"
        type: string
      config_name:
        description: "HF dataset config name"
        required: true
        default: "homophone8-research"
        type: string
      license_policy:
        description: "research includes NonCommercial-derived rows; permissive excludes them"
        required: true
        default: "research"
        type: choice
        options: [research, permissive]
      private:
        description: "Publish HF dataset as private"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: jp-homophone-hf-publish
  cancel-in-progress: true

jobs:
  build-validate-publish:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: saeeew/JP-HomophoneBench
      RELEASE_DIR: data/releases/${{ inputs.release_version }}
      CONFIG_NAME: ${{ inputs.config_name }}
      LICENSE_POLICY: ${{ inputs.license_policy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Require Hugging Face write token
        run: |
          test -n "$HF_TOKEN" || {
            echo "Repository secret HF_TOKEN with Dataset write permission is required" >&2
            exit 2
          }
      - name: Install benchmark-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'datasets>=3.0,<5' 'huggingface-hub>=0.34,<2' 'jsonschema>=4.23' \
            'numpy>=1.26' 'pyopenjtalk>=0.4'
          python -m pip install --no-deps -e .
      - name: Build fixed core8 JSONL release
        run: |
          python scripts/build_jp_homophone_bench.py \
            --output-dir "$RELEASE_DIR" \
            --semantic-tsv data/seed/semantic_homophones.example.tsv \
            --near-threshold 1.0 \
            --require-core8
      - name: Validate release invariants
        run: |
          python scripts/validate_jp_homophone_release.py \
            --release-dir "$RELEASE_DIR" \
            --schema schemas/benchmark.schema.json \
            --require-core8
      - name: Publish Hugging Face Dataset
        shell: bash
        run: |
          private_arg=()
          if [[ "${{ inputs.private }}" == "true" ]]; then private_arg+=(--private); fi
          python scripts/publish_hf_dataset.py \
            --release-dir "$RELEASE_DIR" \
            --repo-id "$HF_REPO_ID" \
            --config-name "$CONFIG_NAME" \
            --license-policy "$LICENSE_POLICY" \
            "${private_arg[@]}"
      - name: Upload immutable JSONL artifact
        uses: actions/upload-artifact@v4
        with:
          name: jp-homophone-bench-${{ inputs.release_version }}
          path: ${{ env.RELEASE_DIR }}
          if-no-files-found: error
          retention-days: 30
