name: jp-homophone-hf-publish

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Immutable release directory name"
        required: true
        default: "v0.1.0"
        type: string
      config_name:
        description: "HF dataset config name"
        required: true
        default: "homophone8"
        type: string
      license_policy:
        description: "permissive excludes NonCommercial-derived rows; research includes them"
        required: true
        default: "permissive"
        type: choice
        options: [permissive, research]
      private:
        description: "Publish HF dataset as private"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: jp-homophone-hf-publish
  cancel-in-progress: true

jobs:
  build-validate-publish:
    runs-on: ubuntu-24.04
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: saeeew/JP-HomophoneBench
      RELEASE_DIR: data/releases/${{ inputs.release_version }}
      CONFIG_NAME: ${{ inputs.config_name }}
      LICENSE_POLICY: ${{ inputs.license_policy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure cache contract
        id: cache
        shell: bash
        run: bash scripts/ci/setup_actions_cache.sh

      - name: Install repository toolchain from mise.lock
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          install: true
          cache: ${{ steps.cache.outputs.persistent != 'true' }}

      - name: Restore uv and HF caches
        if: ${{ steps.cache.outputs.persistent != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.UV_CACHE_DIR }}
            ${{ env.HF_HUB_CACHE }}
            ${{ env.HF_XET_CACHE }}
          key: jp-homophone-publish-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', 'mise.lock') }}

      - name: Require Hugging Face write token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN}" || {
            echo "Repository secret HF_TOKEN with Dataset write permission is required" >&2
            exit 2
          }

      - name: Materialize locked benchmark environment
        run: uv sync --locked --extra dev --extra audio

      - name: Build fixed core8 JSONL release
        run: |
          uv run --locked python scripts/build_jp_homophone_bench.py \
            --output-dir "${RELEASE_DIR}" \
            --semantic-tsv data/seed/semantic_homophones.example.tsv \
            --near-threshold 1.0 \
            --require-core8

      - name: Add CC0 permissive phonetic supplement
        if: env.LICENSE_POLICY == 'permissive'
        run: |
          uv run --locked python scripts/augment_permissive_core8.py \
            --release-dir "${RELEASE_DIR}" \
            --seed data/seed/permissive_phonetic_core.tsv

      - name: Validate release invariants
        run: |
          uv run --locked python scripts/validate_jp_homophone_release.py \
            --release-dir "${RELEASE_DIR}" \
            --schema schemas/benchmark.schema.json \
            --require-core8

      - name: Publish Hugging Face Dataset
        shell: bash
        run: |
          set -euo pipefail
          private_arg=()
          if [[ "${{ inputs.private }}" == "true" ]]; then private_arg+=(--private); fi
          uv run --locked python scripts/publish_hf_dataset.py \
            --release-dir "${RELEASE_DIR}" \
            --repo-id "${HF_REPO_ID}" \
            --config-name "${CONFIG_NAME}" \
            --license-policy "${LICENSE_POLICY}" \
            "${private_arg[@]}"

      - name: Upload immutable JSONL artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jp-homophone-bench-${{ inputs.release_version }}
          path: ${{ env.RELEASE_DIR }}
          if-no-files-found: error
          retention-days: 30
