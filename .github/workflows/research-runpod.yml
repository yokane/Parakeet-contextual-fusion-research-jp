name: research-runpod

on:
  workflow_dispatch:
    inputs:
      experiment_id:
        description: "Immutable experiment identifier"
        required: true
        type: string
      image_reference:
        description: "GHCR runtime in repository@sha256:<digest> form"
        required: true
        type: string
      model_revision:
        description: "Base model full 40-char revision"
        required: true
        type: string
      dataset_revision:
        description: "Benchmark full 40-char revision"
        required: true
        type: string
      gpu_type:
        description: "RunPod GPU type ID"
        required: true
        default: "NVIDIA RTX A5000"
        type: string
      command:
        description: "Command inside the locked runtime"
        required: true
        default: "python scripts/repro/verify_platform.py --require-gpu"
        type: string
      submit:
        description: "Create a non-production Pod instead of plan-only"
        required: true
        default: false
        type: boolean
      confirmation:
        description: "When submit=true, repeat experiment_id exactly"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: research-runpod-${{ inputs.experiment_id }}
  cancel-in-progress: false

jobs:
  plan-or-submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install exact mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          install: true
          cache: true

      - name: Materialize locked RunPod provider environment
        run: mise run deps:sync-runpod

      - name: Guard mutating request
        if: ${{ inputs.submit }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNPOD_API_KEY:-}" || { echo "RUNPOD_API_KEY is missing" >&2; exit 2; }
          [[ "${{ inputs.confirmation }}" == "${{ inputs.experiment_id }}" ]] || {
            echo "confirmation must exactly match experiment_id" >&2
            exit 2
          }

      - name: Build immutable RunPod contract
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked python scripts/providers/build_job_spec.py \
            --provider runpod \
            --experiment-id "${{ inputs.experiment_id }}" \
            --image "${{ inputs.image_reference }}" \
            --model-revision "${{ inputs.model_revision }}" \
            --dataset-revision "${{ inputs.dataset_revision }}" \
            --source-sha "${{ github.sha }}" \
            --command "${{ inputs.command }}" \
            --output dist/providers/runpod-job-spec.json

      - name: Plan or submit non-production Pod
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --spec dist/providers/runpod-job-spec.json
            --gpu-type "${{ inputs.gpu_type }}"
            --container-disk-gb 50
          )
          if [[ "${{ inputs.submit }}" == "true" ]]; then
            args+=(--submit)
          fi
          uv run --locked python scripts/providers/runpod/submit.py "${args[@]}" \
            > dist/providers/runpod-submission.json
          cat dist/providers/runpod-submission.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload provider evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runpod-${{ inputs.experiment_id }}-${{ github.sha }}
          path: |
            dist/providers/runpod-job-spec.json
            dist/providers/runpod-submission.json
          if-no-files-found: error
          retention-days: 30
