name: homophone-saturation-gpu

on:
  workflow_dispatch:
    inputs:
      config_name:
        description: "JP-HomophoneBench HF config"
        required: true
        default: "homophone8-audio"
        type: choice
        options: [homophone8-audio, homophone8, homophone8-research]
      split:
        description: "Evaluation split; homophone8-audio publishes test only"
        required: true
        default: "test"
        type: choice
        options: [test, validation]
      pb_alphas:
        description: "Comma-separated GPU-PB alpha sweep; must include 0"
        required: true
        default: "0.0,0.25,0.5,1.0,1.5,2.0"
        type: string
      required_audio_categories:
        description: "Comma-separated categories that must have runnable audio"
        required: true
        default: "exact_homophone,near_homophone"
        type: string
      min_audio_per_category:
        description: "Minimum runnable rows for every required category"
        required: true
        default: "5"
        type: string
      ngpu_lm_path:
        description: "NGPU-LM model path on the runner"
        required: true
        default: "artifacts/lm/ja-6gram.nemo"
        type: string
      artifact_suffix:
        description: "Result artifact suffix"
        required: true
        default: "pb-alpha"
        type: string

permissions:
  contents: read

concurrency:
  group: homophone-saturation-gpu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: [self-hosted, linux, x64, cuda13]
    timeout-minutes: 300
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_BUCKET: saeeew/J-PACF-YOMI-tdt-bucket
      MANIFEST: data/generated/saturation/nemo_eval.jsonl
      BENCH_INDEX: data/generated/saturation/bench_index.jsonl
      CONTEXT_PHRASES: data/generated/saturation/context_phrases.txt
      NGPU_LM: ${{ inputs.ngpu_lm_path }}
      SWEEP_ROOT: results/saturation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure self-hosted cache contract
        id: cache
        shell: bash
        run: bash scripts/ci/setup_actions_cache.sh

      - name: Install exact mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          install: true
          cache: ${{ steps.cache.outputs.persistent != 'true' }}

      - name: Restore uv and HF caches
        if: ${{ steps.cache.outputs.persistent != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.UV_CACHE_DIR }}
            ${{ env.HF_HUB_CACHE }}
            ${{ env.HF_XET_CACHE }}
          key: jpacf-saturation-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', 'tools/hf-bucket/uv.lock', 'locks/hf-revisions.lock.json') }}

      - name: Materialize exact GPU and Bucket environments
        shell: bash
        run: |
          set -euo pipefail
          mise run deps:sync-gpu
          mise run hf:transport:sync
          echo "${GITHUB_WORKSPACE}/tools/hf-bucket/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify authoritative CUDA13 platform
        run: |
          uv run --locked python scripts/repro/verify_platform.py --require-gpu
          test -f "${NGPU_LM}" || { echo "NGPU-LM file not found: ${NGPU_LM}" >&2; exit 2; }

      - name: Resolve immutable benchmark revision
        id: benchmark
        shell: bash
        run: |
          revision="$(uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path('locks/hf-revisions.lock.json').read_text(encoding='utf-8'))
          print(lock['repositories']['benchmark']['revision'])
          PY
          )"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || exit 2
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Normalize PB alpha sweep
        shell: bash
        env:
          RAW_PB_ALPHAS: ${{ inputs.pb_alphas }}
        run: |
          set -euo pipefail
          mkdir -p "${SWEEP_ROOT}"
          uv run --locked python - <<'PY' > "${SWEEP_ROOT}/alpha_values.txt"
          import os
          values = sorted({float(value.strip()) for value in os.environ["RAW_PB_ALPHAS"].split(",") if value.strip()})
          if len(values) < 2:
              raise SystemExit("At least two distinct PB alpha values are required")
          if not any(abs(value) < 1e-12 for value in values):
              raise SystemExit("PB alpha sweep must include 0.0 as the no-boost baseline")
          for value in values:
              print(f"{value:.12g}")
          PY

      - name: Rehydrate fixed immutable evaluation set
        run: |
          uv run --locked python scripts/materialize_hf_eval.py \
            --repo-id saeeew/JP-HomophoneBench \
            --revision "${{ steps.benchmark.outputs.revision }}" \
            --config "${{ inputs.config_name }}" \
            --split "${{ inputs.split }}" \
            --output-dir data/generated/saturation \
            --rehydrate-audio \
            --require-audio
          uv run --locked python scripts/validate_eval_manifest.py "${MANIFEST}" --require-audio

      - name: Enforce acoustic category coverage
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --provenance data/generated/saturation/eval_provenance.json
            --min-per-category "${{ inputs.min_audio_per_category }}"
            --min-total "${{ inputs.min_audio_per_category }}"
            --output data/generated/saturation/audio_coverage.json
          )
          IFS=',' read -r -a categories <<< "${{ inputs.required_audio_categories }}"
          for raw in "${categories[@]}"; do
            category="${raw//[[:space:]]/}"
            [[ -z "${category}" ]] || args+=(--required-category "${category}")
          done
          uv run --locked python scripts/validate_audio_coverage.py "${args[@]}"

      - name: Record sweep environment
        shell: bash
        env:
          CONFIG_NAME: ${{ inputs.config_name }}
          SPLIT_NAME: ${{ inputs.split }}
        run: |
          set -euo pipefail
          uv run --locked python - <<'PY'
          import json
          import os
          import platform
          import subprocess
          from importlib import metadata
          import torch

          def command(*args):
              return subprocess.check_output(args, text=True).strip()

          with open(os.path.join(os.environ["SWEEP_ROOT"], "alpha_values.txt"), encoding="utf-8") as handle:
              alphas = [float(line) for line in handle if line.strip()]
          lock = json.load(open("locks/hf-revisions.lock.json", encoding="utf-8"))
          report = {
              "git_sha": command("git", "rev-parse", "HEAD"),
              "platform_contract": "linux/amd64",
              "cuda_major_contract": 13,
              "python": platform.python_version(),
              "torch": torch.__version__,
              "nemo": metadata.version("nemo-toolkit"),
              "cuda_runtime": torch.version.cuda,
              "gpu": torch.cuda.get_device_name(0),
              "config": os.environ["CONFIG_NAME"],
              "split": os.environ["SPLIT_NAME"],
              "pb_alphas": alphas,
              "base_model_revision": lock["repositories"]["base_model"]["revision"],
              "benchmark_revision": lock["repositories"]["benchmark"]["revision"],
          }
          with open(os.path.join(os.environ["SWEEP_ROOT"], "environment.json"), "w", encoding="utf-8") as handle:
              json.dump(report, handle, ensure_ascii=False, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      - name: Run E03 GPU-PB alpha sweep through mise
        shell: bash
        run: |
          set -euo pipefail
          : > "${SWEEP_ROOT}/result_specs.txt"
          while IFS= read -r alpha; do
            [[ -z "${alpha}" ]] && continue
            label="$(uv run --locked python -c 'import sys; print(f"{float(sys.argv[1]):.2f}")' "${alpha}")"
            experiment="E03_pb_${label}"
            run_dir="${SWEEP_ROOT}/${experiment}"
            mkdir -p "${run_dir}"
            RESULTS_DIR="${run_dir}" PB_ALPHA="${alpha}" mise run run:e03
            result="${run_dir}/E03_gpu_pb.jsonl"
            test -f "${result}" || { echo "Missing E03 result: ${result}" >&2; exit 2; }
            printf '%s=%s\n' "${experiment}" "${result}" >> "${SWEEP_ROOT}/result_specs.txt"
          done < "${SWEEP_ROOT}/alpha_values.txt"
          test -s "${SWEEP_ROOT}/result_specs.txt"

      - name: Collect paired sweep metrics
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r spec; do [[ -z "${spec}" ]] || args+=(--result "${spec}"); done < "${SWEEP_ROOT}/result_specs.txt"
          uv run --locked python scripts/collect_experiment_metrics.py \
            --benchmark "${BENCH_INDEX}" \
            --execution-manifest "${MANIFEST}" \
            "${args[@]}" \
            --baseline E03_pb_0.00 \
            --parquet "${SWEEP_ROOT}/metrics.parquet" \
            --summary "${SWEEP_ROOT}/summary.json"

      - name: Build sweep specification
        run: |
          uv run --locked python - <<'PY'
          import json
          import os
          with open(os.path.join(os.environ["SWEEP_ROOT"], "alpha_values.txt"), encoding="utf-8") as handle:
              alphas = [float(line) for line in handle if line.strip()]
          spec = {"sweeps": [{
              "name": "gpu_pb_alpha",
              "parameter": "PB_ALPHA",
              "benefit_metric": "entity_accuracy",
              "risk_metric": "distractor_false_positive_rate",
              "categories": ["exact_homophone", "near_homophone", "voicing", "long_vowel", "geminate", "moraic_nasal", "pitch_accent", "semantic_only"],
              "points": [{"experiment": f"E03_pb_{alpha:.2f}", "value": alpha} for alpha in alphas],
          }]}
          with open(os.path.join(os.environ["SWEEP_ROOT"], "sweep.json"), "w", encoding="utf-8") as handle:
              json.dump(spec, handle, ensure_ascii=False, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      - name: Detect TurboBias saturation
        run: |
          uv run --locked python scripts/analyze_saturation.py \
            --metrics "${SWEEP_ROOT}/metrics.parquet" \
            --sweep "${SWEEP_ROOT}/sweep.json" \
            --output "${SWEEP_ROOT}/saturation.json" \
            --bootstrap-samples 10000 \
            --confidence 0.95 \
            --min-gain 0.01 \
            --min-risk-increase 0.02 \
            --alpha 0.05

      - name: Persist immutable saturation run to HF Bucket
        shell: bash
        run: |
          set -euo pipefail
          run_id="gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-saturation"
          run_dir="dist/hf-runs/${run_id}"
          uv run --locked python scripts/hf/build_run_bundle.py \
            --results-dir "${SWEEP_ROOT}" \
            --output-dir "${run_dir}" \
            --run-id "${run_id}" \
            --workflow-kind homophone-saturation \
            --benchmark-index "${BENCH_INDEX}" \
            --execution-manifest "${MANIFEST}"
          bash scripts/hf/hf-push-run.sh "${run_dir}"

      - name: Upload saturation artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homophone-saturation-${{ inputs.artifact_suffix }}-${{ inputs.config_name }}-${{ inputs.split }}-${{ github.sha }}
          path: |
            data/generated/saturation/eval_provenance.json
            data/generated/saturation/audio_coverage.json
            data/generated/saturation/bench_index.jsonl
            data/generated/saturation/nemo_eval.jsonl
            data/generated/saturation/context_phrases.txt
            results/saturation
          if-no-files-found: error
          retention-days: 30
