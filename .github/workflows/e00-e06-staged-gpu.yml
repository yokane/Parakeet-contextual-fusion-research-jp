name: e00-e06-staged-gpu

on:
  push:
    branches:
      - run/e00-e06-selfhosted-20260901

permissions:
  contents: read

concurrency:
  group: e00-e06-cuda-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: [self-hosted, linux, x64, cuda13]
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      - name: Configure persistent self-hosted caches
        id: cache
        shell: bash
        run: bash scripts/ci/setup_actions_cache.sh

      - name: Isolate mise from runner user configuration
        shell: bash
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/mise-global.toml"
          : > "${RUNNER_TEMP}/mise-system.toml"
          echo "MISE_GLOBAL_CONFIG_FILE=${RUNNER_TEMP}/mise-global.toml" >> "${GITHUB_ENV}"
          echo "MISE_SYSTEM_CONFIG_FILE=${RUNNER_TEMP}/mise-system.toml" >> "${GITHUB_ENV}"

      - name: Install exact mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          install: true
          cache: false

      - name: Materialize canonical GPU environment
        shell: bash
        run: mise run deps:sync-gpu

      - name: Diagnose CUDA library selection
        shell: bash
        run: |
          set +e
          echo '=== GPU ==='
          nvidia-smi
          echo '=== installed NVIDIA/CUDA packages ==='
          dpkg -l | grep -E 'nvidia|cuda' | head -200 || true
          echo '=== libcuda candidates ==='
          ls -l /usr/lib/wsl/lib/libcuda.so* 2>/dev/null || true
          ls -l /usr/lib/x86_64-linux-gnu/libcuda.so* 2>/dev/null || true
          readlink -f /usr/lib/wsl/lib/libcuda.so.1 2>/dev/null || true
          readlink -f /usr/lib/x86_64-linux-gnu/libcuda.so.1 2>/dev/null || true
          echo '=== torch import, no CUDA init ==='
          uv run --locked --no-sync python -c 'import torch; print(torch.__version__, torch.version.cuda)'
          echo "import_rc=$?"
          echo '=== CUDA check with existing library order ==='
          uv run --locked --no-sync python -c 'import torch; print(torch.cuda.is_available())'
          echo "default_check_rc=$?"
          echo '=== CUDA check prioritizing WSL stub ==='
          LD_LIBRARY_PATH=/usr/lib/wsl/lib:/usr/local/cuda/lib64:${LD_LIBRARY_PATH-} \
            uv run --locked --no-sync python -c 'import torch; print(torch.cuda.is_available()); print(torch.cuda.device_count()); print(torch.cuda.get_device_name(0) if torch.cuda.device_count() else "no-device")'
          echo "wsl_first_rc=$?"
          echo '=== NVML check prioritizing WSL stub ==='
          PYTORCH_NVML_BASED_CUDA_CHECK=1 \
          LD_LIBRARY_PATH=/usr/lib/wsl/lib:/usr/local/cuda/lib64:${LD_LIBRARY_PATH-} \
            uv run --locked --no-sync python -c 'import torch; print(torch.cuda.is_available())'
          echo "nvml_wsl_first_rc=$?"
          exit 0
