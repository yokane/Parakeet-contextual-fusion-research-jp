name: force-cancel-current-runtime

on:
  push:
    branches: [feat/portable-ghcr-gpu-runtime]
    paths:
      - .github/workflows/force-cancel-current-runtime.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Force-cancel stalled runtime proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code="$(curl -L -sS -o /tmp/response.json -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/33562398957/force-cancel")"
          [[ "$code" == 202 || "$code" == 409 ]] || { cat /tmp/response.json; exit 1; }
          echo "force-cancel HTTP ${code}"
