name: hf-model-publish

on:
  workflow_dispatch:
    inputs:
      private:
        description: "Publish/keep model repository private"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: hf-model-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-scaffold:
    runs-on: ubuntu-24.04
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_MODEL_REPO: saeeew/J-PACF-YOMI-tdt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure cache contract
        id: cache
        shell: bash
        run: bash scripts/ci/setup_actions_cache.sh

      - name: Install repository toolchain from mise.lock
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          install: true
          cache: ${{ steps.cache.outputs.persistent != 'true' }}

      - name: Restore uv and HF caches
        if: ${{ steps.cache.outputs.persistent != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.UV_CACHE_DIR }}
            ${{ env.HF_HUB_CACHE }}
            ${{ env.HF_XET_CACHE }}
          key: hf-model-publish-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Materialize locked publication environment
        run: mise run deps:sync

      - name: Verify token and scaffold
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo "HF_TOKEN secret is missing" >&2; exit 2; }
          test -f hf_model/README.md
          test -f hf_model/fusion_config.yaml
          test -f hf_model/research_manifest.json

      - name: Publish model scaffold
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --repo-id "${HF_MODEL_REPO}"
            --folder hf_model
            --commit-message "Sync J-PACF-YOMI-TDT scaffold from GitHub ${GITHUB_SHA}"
          )
          if [[ "${{ inputs.private }}" == "true" ]]; then
            args+=(--private)
          fi
          uv run --locked python scripts/publish_hf_model.py "${args[@]}"
