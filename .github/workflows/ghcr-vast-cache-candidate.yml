name: ghcr-vast-cache-candidate

on:
  workflow_dispatch:
  push:
    branches: [feat/portable-ghcr-gpu-runtime]
    paths:
      - "locks/vast-cache-base.lock.json"
      - "Dockerfile.vast-cache"
      - "scripts/container/inside.sh"
      - "scripts/container/verify_runtime.py"
      - ".github/workflows/ghcr-vast-cache-candidate.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-vast-cache-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/jpacf-yomi-tdt-runtime-vast-cache
  CACHE_SCOPE: jpacf-runtime-vast-cache-linux-amd64-cuda13

jobs:
  build-and-verify:
    runs-on: [self-hosted, linux, x64, cuda13]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      - name: Configure persistent BuildKit cache
        shell: bash
        env:
          ACTIONS_CACHE_SCOPE: ${{ env.CACHE_SCOPE }}
        run: bash scripts/ci/setup_actions_cache.sh

      - name: Isolate Docker client configuration
        shell: bash
        run: |
          set -euo pipefail
          docker_config="${RUNNER_TEMP}/docker-config-vast-cache"
          rm -rf "$docker_config"
          mkdir -p "$docker_config"
          printf '{}\n' > "$docker_config/config.json"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          driver: docker-container

      - name: Read cache-friendly immutable base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          base="$(python -c 'import json; print(json.load(open("locks/vast-cache-base.lock.json"))["images"]["vast_pytorch"]["reference"])')"
          [[ "$base" =~ @sha256:[0-9a-f]{64}$ ]]
          echo "reference=$base" >> "$GITHUB_OUTPUT"

      - name: Build and push cache candidate
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.vast-cache
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.reference }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: ${{ env.BUILDKIT_CACHE_FROM }}
          cache-to: ${{ env.BUILDKIT_CACHE_TO }}
          provenance: false
          sbom: false

      - name: Verify candidate through NVIDIA runtime
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
          docker pull "$image"
          docker run --rm --gpus all \
            -e JPA_CF_STATE_ROOT=/workspace/state \
            -v "${RUNNER_TEMP}/jpacf-vast-cache-state:/workspace/state" \
            "$image" \
            bash /opt/jpacf/scripts/container/inside.sh \
              python /opt/jpacf/scripts/container/verify_runtime.py --require-gpu

      - name: Record candidate identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/runtime
          image="${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
          cat > dist/runtime/vast-cache-candidate.json <<JSON
          {
            "schema_version": 1,
            "source_git_sha": "${GITHUB_SHA}",
            "image": "${image}",
            "digest": "${{ steps.build.outputs.digest }}",
            "base_image": "${{ steps.base.outputs.reference }}"
          }
          JSON
          cat dist/runtime/vast-cache-candidate.json

      - name: Upload candidate identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-vast-cache-candidate-${{ github.run_id }}
          path: dist/runtime/vast-cache-candidate.json
          retention-days: 30
