name: ghcr-runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - "mise.toml"
      - "mise.lock"
      - "stack.lock.yaml"
      - "locks/containers.lock.json"
      - "src/**"
      - "scripts/**"
      - "schemas/**"
      - "configs/**"
      - "experiments/**"
      - "hf_model/**"
      - ".github/workflows/ghcr-runtime.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/jpacf-yomi-tdt-runtime
  CACHE_SCOPE: jpacf-runtime-linux-amd64-cuda13

jobs:
  build-and-verify:
    runs-on: [self-hosted, linux, x64, cuda13]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure self-hosted cache contract
        id: cache
        shell: bash
        env:
          ACTIONS_CACHE_SCOPE: ${{ env.CACHE_SCOPE }}
        run: bash scripts/ci/setup_actions_cache.sh

      - name: Install repository toolchain from mise.lock
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          install: true
          cache: ${{ steps.cache.outputs.persistent != 'true' }}

      - name: Verify host research platform
        run: mise run platform:verify

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Read immutable base image reference
        id: base
        shell: bash
        run: |
          set -euo pipefail
          reference="$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('locks/containers.lock.json').read_text(encoding='utf-8'))
          print(payload['images']['nvidia_pytorch']['reference'])
          PY
          )"
          [[ "${reference}" =~ @sha256:[0-9a-f]{64}$ ]] || {
            echo "base image is not digest-pinned" >&2
            exit 2
          }
          echo "reference=${reference}" >> "${GITHUB_OUTPUT}"

      - name: Build and push runtime
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=J-PACF-YOMI-TDT runtime
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.vendor=J-PACF-YOMI-TDT research
          cache-from: ${{ env.BUILDKIT_CACHE_FROM }}
          cache-to: ${{ env.BUILDKIT_CACHE_TO }}
          build-args: BASE_IMAGE=${{ steps.base.outputs.reference }}

      - name: Commit persistent BuildKit cache generation
        if: ${{ env.SELF_CACHE_PERSISTENT == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -d "${BUILDKIT_CACHE_DIR}-next" || {
            echo "BuildKit did not produce the expected local cache export" >&2
            exit 2
          }
          rm -rf "${BUILDKIT_CACHE_DIR}"
          mv "${BUILDKIT_CACHE_DIR}-next" "${BUILDKIT_CACHE_DIR}"

      - name: Verify built image on CUDA13 GPU
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
          docker pull "$image"
          docker run --rm --gpus all \
            -e JPA_CF_PLATFORM=linux/amd64 \
            -e JPA_CF_CUDA_MAJOR=13 \
            "$image" \
            python scripts/repro/verify_platform.py --require-gpu

      - name: Record immutable runtime identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/runtime
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          digest = "${{ steps.build.outputs.digest }}"
          if not digest.startswith("sha256:") or len(digest) != 71:
              raise SystemExit(f"invalid runtime digest: {digest}")
          image = f"{os.environ['REGISTRY']}/{os.environ['IMAGE_NAME']}"
          payload = {
              "schema_version": 2,
              "source_git_sha": "${{ github.sha }}",
              "platform": "linux/amd64",
              "cuda_major": 13,
              "nemo_toolkit": "3.0.0",
              "torch": "2.12.0+cu132",
              "digest": digest,
              "reference": f"{image}@{digest}",
              "published_tag": f"sha-${{ github.sha }}",
              "gpu_verified": True,
          }
          Path("dist/runtime/runtime-image.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload runtime identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-image-${{ github.sha }}
          path: dist/runtime/runtime-image.json
          if-no-files-found: error
          retention-days: 30
