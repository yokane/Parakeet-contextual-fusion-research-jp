name: ghcr-runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "src/**"
      - "scripts/**"
      - "schemas/**"
      - "configs/**"
      - "experiments/**"
      - "hf_model/**"
      - ".github/workflows/ghcr-runtime.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/jpacf-yomi-tdt-runtime
  CACHE_SCOPE: jpacf-runtime-linux-amd64

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: OCI metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=J-PACF-YOMI-TDT runtime
            org.opencontainers.image.description=Cached NeMo/Python runtime for Japanese contextual ASR experiments

      - name: Build and push runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=${{ env.CACHE_SCOPE }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=gha,scope=${{ env.CACHE_SCOPE }},mode=max
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          build-args: |
            BASE_IMAGE=nvcr.io/nvidia/pytorch:25.08-py3

      - name: Publish image reference
        shell: bash
        run: |
          {
            echo '### GHCR runtime'
            echo
            echo '```text'
            echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}'
            echo '```'
            echo
            echo 'BuildKit cache: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache` + GitHub Actions cache.'
          } >> "${GITHUB_STEP_SUMMARY}"
