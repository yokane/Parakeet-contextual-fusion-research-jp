name: ghcr-runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - "stack.lock.yaml"
      - "locks/containers.lock.json"
      - "src/**"
      - "scripts/**"
      - "schemas/**"
      - "configs/**"
      - "experiments/**"
      - "hf_model/**"
      - "tools/hf-bucket/**"
      - ".github/workflows/ghcr-runtime.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/jpacf-yomi-tdt-runtime
  CACHE_SCOPE: jpacf-runtime-linux-amd64-cuda13
  HF_BUCKET: saeeew/J-PACF-YOMI-tdt-bucket

jobs:
  build-and-verify:
    runs-on: [self-hosted, linux, x64, cuda13]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      - name: Configure persistent BuildKit cache
        id: cache
        shell: bash
        env:
          ACTIONS_CACHE_SCOPE: ${{ env.CACHE_SCOPE }}
        run: bash scripts/ci/setup_actions_cache.sh

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Read immutable base image reference
        id: base
        shell: bash
        run: |
          set -euo pipefail
          reference="$(sed -n 's/^[[:space:]]*"reference": "\([^"]*\)",*$/\1/p' locks/containers.lock.json | head -1)"
          [[ "${reference}" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "base image is not digest-pinned" >&2; exit 2; }
          echo "reference=${reference}" >> "${GITHUB_OUTPUT}"

      - name: Build and push runtime
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: ${{ env.BUILDKIT_CACHE_FROM }}
          cache-to: ${{ env.BUILDKIT_CACHE_TO }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.reference }}
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}

      - name: Commit persistent BuildKit cache generation
        if: ${{ env.SELF_CACHE_PERSISTENT == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -d "${BUILDKIT_CACHE_DIR}-next"
          rm -rf "${BUILDKIT_CACHE_DIR}"
          mv "${BUILDKIT_CACHE_DIR}-next" "${BUILDKIT_CACHE_DIR}"

      - name: Verify built image through NVIDIA container runtime
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
          mkdir -p .jpacf-state/{hf,uv,xdg,torch}
          docker pull "$image"
          docker run --rm --gpus all --ipc=host --shm-size 8g \
            -e HF_HOME=/cache/huggingface \
            -e UV_CACHE_DIR=/cache/uv \
            -e XDG_CACHE_HOME=/cache/xdg \
            -e TORCH_HOME=/cache/torch \
            -v "$PWD/.jpacf-state/hf:/cache/huggingface" \
            -v "$PWD/.jpacf-state/uv:/cache/uv" \
            -v "$PWD/.jpacf-state/xdg:/cache/xdg" \
            -v "$PWD/.jpacf-state/torch:/cache/torch" \
            "$image" \
            python /opt/jpacf/scripts/container/verify_runtime.py --require-gpu

      - name: Record immutable runtime identity
        shell: bash
        run: |
          set -euo pipefail
          digest='${{ steps.build.outputs.digest }}'
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p dist/runtime
          cat > dist/runtime/runtime-image.json <<EOF
          {
            "schema_version": 3,
            "source_git_sha": "${{ github.sha }}",
            "platform": "linux/amd64",
            "cuda_major": 13,
            "nemo_toolkit": "3.0.0",
            "torch": "2.12.0+cu132",
            "digest": "$digest",
            "reference": "${REGISTRY}/${IMAGE_NAME}@$digest",
            "published_tag": "sha-${{ github.sha }}",
            "gpu_verified": true,
            "execution_contract": "docker-nvidia-runtime"
          }
          EOF
          cat dist/runtime/runtime-image.json

      - name: Publish runtime identity to HF Bucket
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${HF_TOKEN:-}" ]] || { echo "HF_TOKEN is required" >&2; exit 2; }
          image="${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
          docker run --rm \
            -e HF_TOKEN \
            -e HF_BUCKET \
            -e HF_TRANSPORT_PROJECT=/opt/jpacf/tools/hf-bucket \
            -v "$PWD:/workspace/project" \
            -w /workspace/project \
            "$image" \
            bash -lc 'source scripts/hf/hf-identity.sh; hf_bucket_cli buckets sync dist/runtime "hf://buckets/${HF_BUCKET}/runtime/sha-${GITHUB_SHA:-unknown}" --token "$HF_TOKEN"'

      - name: Upload runtime identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-image-${{ github.sha }}
          path: dist/runtime/runtime-image.json
          if-no-files-found: error
          retention-days: 30
