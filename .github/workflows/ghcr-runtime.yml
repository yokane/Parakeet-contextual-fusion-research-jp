name: ghcr-runtime

on:
  workflow_dispatch:
  push:
    branches: [main, feat/portable-ghcr-gpu-runtime]
    paths:
      - "Dockerfile"
      - "Dockerfile.runtime-base"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - "stack.lock.yaml"
      - "locks/containers.lock.json"
      - "src/**"
      - "scripts/**"
      - "schemas/**"
      - "configs/**"
      - "experiments/**"
      - "hf_model/**"
      - "tools/hf-bucket/**"
      - ".github/workflows/ghcr-runtime.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/jpacf-yomi-tdt-runtime
  HF_BUCKET: saeeew/J-PACF-YOMI-tdt-bucket

jobs:
  build-and-verify:
    runs-on: [self-hosted, linux, x64, cuda13]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      - name: Isolate Docker client configuration
        shell: bash
        run: |
          set -euo pipefail
          docker_config="${RUNNER_TEMP}/docker-config"
          rm -rf "${docker_config}"
          mkdir -p "${docker_config}"
          printf '{}\n' > "${docker_config}/config.json"
          echo "DOCKER_CONFIG=${docker_config}" >> "${GITHUB_ENV}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keep the docker driver on the self-hosted runner because it is known to
      # initialize reliably there. The hosted fallback uses docker-container to
      # avoid local image-store export pressure.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker

      - name: Read immutable NVIDIA base image reference
        id: nvidia-base
        shell: bash
        run: |
          set -euo pipefail
          reference="$(sed -n 's/^[[:space:]]*"reference": "\([^"]*\)",*$/\1/p' locks/containers.lock.json | head -1)"
          [[ "${reference}" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "base image is not digest-pinned" >&2; exit 2; }
          echo "reference=${reference}" >> "${GITHUB_OUTPUT}"

      - name: Build dependency base if needed and push immutable runtime
        id: build
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
          NVIDIA_BASE_IMAGE: ${{ steps.nvidia-base.outputs.reference }}
        run: bash scripts/ci/build_runtime_image.sh

      - name: Verify built image through NVIDIA container runtime
        shell: bash
        run: |
          set -euo pipefail
          image='${{ steps.build.outputs.image }}'
          [[ "$image" =~ @sha256:[0-9a-f]{64}$ ]]
          mkdir -p .jpacf-state
          docker pull "$image"
          docker run --rm --gpus all --ipc=host --shm-size 8g \
            -v "$PWD/.jpacf-state:/workspace/state" \
            "$image"

      - name: Promote verified digest to main tag
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:main" \
            '${{ steps.build.outputs.image }}'

      - name: Record immutable runtime identity
        shell: bash
        run: |
          set -euo pipefail
          digest='${{ steps.build.outputs.digest }}'
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p dist/runtime
          cat > dist/runtime/runtime-image.json <<EOF
          {
            "schema_version": 4,
            "source_git_sha": "${{ github.sha }}",
            "platform": "linux/amd64",
            "cuda_major": 13,
            "nemo_toolkit": "3.0.0",
            "torch": "2.12.0+cu132",
            "runtime_base_reference": "${{ steps.build.outputs.base_reference }}",
            "digest": "$digest",
            "reference": "${{ steps.build.outputs.image }}",
            "published_tag": "sha-${{ github.sha }}",
            "gpu_verified": true,
            "execution_contract": "docker-nvidia-runtime",
            "state_mount": "/workspace/state"
          }
          EOF
          cat dist/runtime/runtime-image.json

      - name: Publish runtime identity to HF Bucket
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${HF_TOKEN:-}" ]] || { echo "HF_TOKEN is required" >&2; exit 2; }
          image='${{ steps.build.outputs.image }}'
          docker run --rm \
            -e HF_TOKEN \
            -e HF_BUCKET \
            -e GITHUB_SHA \
            -v "$PWD:/workspace/project" \
            -v "$PWD/.jpacf-state:/workspace/state" \
            -w /workspace/project \
            "$image" \
            bash -lc \
            'source scripts/hf/hf-identity.sh; hf_bucket_cli buckets sync dist/runtime "hf://buckets/${HF_BUCKET}/runtime/sha-${GITHUB_SHA}" --token "$HF_TOKEN"'

      - name: Upload runtime identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-image-${{ github.sha }}
          path: dist/runtime/runtime-image.json
          if-no-files-found: error
          retention-days: 30
