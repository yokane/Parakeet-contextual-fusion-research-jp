name: vast-diagnose

on:
  push:
    branches: [feat/portable-ghcr-gpu-runtime]
    paths:
      - .github/vast-diagnose.trigger

permissions:
  actions: write
  contents: read

jobs:
  force-cancel-stale-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      STALE_RUN_ID: "33567053241"
    steps:
      - name: Force-cancel stale workflow controller
        shell: bash
        run: |
          set -euo pipefail
          endpoint="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${STALE_RUN_ID}/force-cancel"
          code="$(curl --silent --show-error --output "$RUNNER_TEMP/body" --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$endpoint")"
          cat "$RUNNER_TEMP/body" || true
          case "$code" in
            202|409) echo "force-cancel accepted/already terminal: HTTP $code" ;;
            *) echo "unexpected force-cancel response: HTTP $code" >&2; exit 1 ;;
          esac
