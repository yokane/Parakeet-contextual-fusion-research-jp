name: parakeet-context-fusion-ci

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "experiments/**"
      - "configs/**"
      - "schemas/**"
      - "Makefile"
      - "pyproject.toml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "experiments/**"
      - "configs/**"
      - "schemas/**"
      - "Makefile"
      - "pyproject.toml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Cache the installed dependency environment, not the source tree. The
      # key changes only when dependency metadata/Python changes.
      - name: Restore dependency environment
        id: dependency-cache
        uses: actions/cache@v6
        with:
          path: .venv
          key: >-
            jpacf-ci-venv-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('pyproject.toml') }}

      - name: Install CPU dependencies on cache miss
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip setuptools wheel
          .venv/bin/python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          .venv/bin/python - <<'PY'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          requirements = [
              requirement
              for requirement in project.get("dependencies", [])
              if not requirement.lower().startswith("torch")
          ]
          requirements.extend(project.get("optional-dependencies", {}).get("dev", []))
          subprocess.check_call([sys.executable, "-m", "pip", "install", *requirements])
          PY

      - name: Activate cached dependency environment
        shell: bash
        run: echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"

      # Source installation is intentionally separate from dependency caching.
      - name: Install source only
        run: python -m pip install --no-deps -e .

      - name: Lint
        run: ruff check src scripts tests

      - name: Unit tests
        run: pytest

      - name: Compile Python sources
        run: python -m compileall -q src scripts

      - name: Shell syntax
        run: find experiments scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
