name: parakeet-context-fusion-ci

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "experiments/**"
      - "configs/**"
      - "schemas/**"
      - "Makefile"
      - "pyproject.toml"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "experiments/**"
      - "configs/**"
      - "schemas/**"
      - "Makefile"
      - "pyproject.toml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install datasets huggingface-hub jsonschema numpy omegaconf pydantic pyyaml soundfile pyarrow pytest ruff
          python -m pip install --no-deps -e .
      - name: Lint
        run: ruff check src scripts tests
      - name: Unit tests
        run: pytest
      - name: Compile Python sources
        run: python -m compileall -q src scripts
      - name: Shell syntax
        run: find experiments scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
