name: parakeet-context-fusion-ci

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "experiments/**"
      - "configs/**"
      - "schemas/**"
      - "locks/**"
      - "sbom/**"
      - "mise.toml"
      - "mise.lock"
      - "uv.lock"
      - "Makefile"
      - "pyproject.toml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "experiments/**"
      - "configs/**"
      - "schemas/**"
      - "locks/**"
      - "sbom/**"
      - "mise.toml"
      - "mise.lock"
      - "uv.lock"
      - "Makefile"
      - "pyproject.toml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  cpu-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install repository toolchain from mise.lock
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          install: true
          cache: true

      - name: Restore uv artifact cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/uv
          key: jpacf-uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Run canonical CI job
        run: mise run ci
