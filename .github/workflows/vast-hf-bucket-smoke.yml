name: vast-hf-bucket-smoke

on:
  workflow_dispatch:
  push:
    branches: [feat/portable-ghcr-gpu-runtime]
    paths:
      - ".github/workflows/vast-hf-bucket-smoke.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: vast-hf-bucket-smoke-${{ github.ref }}
  cancel-in-progress: false

env:
  RUNTIME_IMAGE: ghcr.io/yokane/jpacf-yomi-tdt-runtime@sha256:df3140308992bfb0fc5b84cae6dfbbe6e388709725e9aa0810329965c91ba2ad
  HF_BUCKET: saeeew/J-PACF-YOMI-tdt-bucket
  STORAGE_GB: "50"
  GPU_RAM_GB: "24"
  GPU_ALLOWLIST: RTX_4090,RTX_3090
  PREDICTED_MINUTES: "20"
  MAX_COST_USD: "0.50"
  OFFER_LIMIT: "50"

jobs:
  vast-to-hf-bucket:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GHCR_TOKEN: ${{ github.token }}
      SMOKE_RUN_KEY: vast-hf-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      VAST_LABEL: jpacf-vast-hf-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install exact mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          install: true
          cache: true

      - name: Materialize locked Vast provider environment
        run: mise run deps:sync-vast

      - name: Validate smoke contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VAST_API_KEY:-}" || { echo "VAST_API_KEY is required" >&2; exit 2; }
          test -n "${HF_TOKEN:-}" || { echo "HF_TOKEN is required" >&2; exit 2; }
          test -n "${GHCR_TOKEN:-}" || { echo "GitHub package token is required" >&2; exit 2; }
          [[ "$RUNTIME_IMAGE" =~ ^ghcr\.io/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@sha256:[0-9a-f]{64}$ ]] || {
            echo "RUNTIME_IMAGE must be immutable repository@sha256:<digest>" >&2
            exit 2
          }
          python - <<'PY'
          predicted = float("${{ env.PREDICTED_MINUTES }}")
          budget = float("${{ env.MAX_COST_USD }}")
          if predicted <= 0:
              raise SystemExit("PREDICTED_MINUTES must be positive")
          if not (0 < budget <= 0.50):
              raise SystemExit("MAX_COST_USD must be > 0 and <= 0.50")
          PY

      - name: Build modern 24GB Vast offer query
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/providers dist/vast-smoke
          uv run --locked python scripts/providers/vast/build_search_query.py \
            --gpu-name "$GPU_ALLOWLIST" \
            --num-gpus "1" \
            --gpu-ram ">=${GPU_RAM_GB}" \
            --output-json dist/providers/vast-search-query.json \
            > dist/providers/vast-search-query.txt
          cat dist/providers/vast-search-query.txt

      - name: Query and rank Vast offers by predicted total cost
        shell: bash
        run: |
          set -euo pipefail
          query="$(cat dist/providers/vast-search-query.txt)"
          uv run --locked vastai search offers \
            --api-key "$VAST_API_KEY" \
            --raw \
            --no-default \
            --type bid \
            --order dph_total \
            --storage "$STORAGE_GB" \
            --limit "$OFFER_LIMIT" \
            "$query" \
            > dist/providers/vast-raw.json

          uv run --locked python scripts/providers/vast/rank_offers.py \
            --input dist/providers/vast-raw.json \
            --predicted-minutes "$PREDICTED_MINUTES" \
            --max-cost-usd "$MAX_COST_USD" \
            --output dist/providers/vast-inventory.json \
            | tee dist/providers/vast-inventory.md
          cat dist/providers/vast-inventory.md >> "$GITHUB_STEP_SUMMARY"

          python - <<'PY'
          import json
          from pathlib import Path
          inventory = json.loads(Path("dist/providers/vast-inventory.json").read_text())
          offers = inventory.get("offers", [])
          if not offers:
              raise SystemExit("No RTX 4090/3090 Vast offer satisfies storage/budget policy")
          selected = offers[0]
          Path("dist/providers/vast-selected-offer.json").write_text(
              json.dumps(selected, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with open(Path("/tmp") / "vast-selected.env", "w", encoding="utf-8") as handle:
              handle.write(f"VAST_OFFER_ID={selected['offer_id']}\n")
              handle.write(f"VAST_GPU_NAME={selected['gpu_name']}\n")
              handle.write(f"VAST_DPH_TOTAL={selected['dph_total']}\n")
              handle.write(f"VAST_PREDICTED_COST={selected['predicted_cost_usd']}\n")
          PY
          cat /tmp/vast-selected.env >> "$GITHUB_ENV"

      - name: Build the Vast onstart payload
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/vast-smoke-remote.sh" <<'REMOTE'
          #!/usr/bin/env bash
          set -euo pipefail
          export JPA_CF_CONTAINER_RUNTIME=1
          work=/workspace/state/artifacts/vast-hf-smoke
          rm -rf "$work"
          mkdir -p "$work"

          python /opt/jpacf/scripts/container/verify_runtime.py --require-gpu > "$work/runtime-verify.txt"

          python - <<'PY'
          import datetime as dt
          import json
          import os
          import platform
          import socket
          import subprocess
          from pathlib import Path
          import torch

          if not torch.cuda.is_available():
              raise SystemExit("torch.cuda.is_available() is false")
          tensor = torch.arange(16, device="cuda", dtype=torch.float32)
          checksum = float((tensor * tensor).sum().item())
          smi = subprocess.check_output(
              [
                  "nvidia-smi",
                  "--query-gpu=name,driver_version,memory.total",
                  "--format=csv,noheader,nounits",
              ],
              text=True,
          ).strip().splitlines()[0]
          gpu_name, driver_version, memory_mib = [part.strip() for part in smi.split(",", 2)]
          payload = {
              "schema_version": 1,
              "provider": "vast",
              "run_key": os.environ["SMOKE_RUN_KEY"],
              "vast_label": os.environ["VAST_LABEL"],
              "offer_id": int(os.environ["VAST_OFFER_ID"]),
              "expected_image": os.environ["EXPECTED_IMAGE"],
              "hostname": socket.gethostname(),
              "platform": platform.platform(),
              "gpu_name": gpu_name,
              "driver_version": driver_version,
              "gpu_memory_mib": int(memory_mib),
              "torch": torch.__version__,
              "torch_cuda": torch.version.cuda,
              "cuda_available": True,
              "cuda_device_count": torch.cuda.device_count(),
              "cuda_tensor_checksum": checksum,
              "created_at_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
          }
          Path("/workspace/state/artifacts/vast-hf-smoke/result.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          printf '%s\n' "$SMOKE_RUN_KEY" > "$work/_SUCCESS"
          source /opt/jpacf/scripts/hf/hf-identity.sh
          hf_bucket_cli buckets sync \
            "$work" \
            "hf://buckets/${HF_BUCKET}/runs/${SMOKE_RUN_KEY}/vast-smoke" \
            --token "$HF_TOKEN"
          REMOTE
          remote_script_b64="$(base64 -w0 "$RUNNER_TEMP/vast-smoke-remote.sh")"
          echo "REMOTE_SCRIPT_B64=$remote_script_b64" >> "$GITHUB_ENV"

      - name: Create short-lived Vast GPU instance with onstart smoke
        shell: bash
        run: |
          set -euo pipefail
          create_response="$(
            uv run --locked vastai create instance "$VAST_OFFER_ID" \
              --api-key "$VAST_API_KEY" \
              --raw \
              --image "$RUNTIME_IMAGE" \
              --disk "$STORAGE_GB" \
              --label "$VAST_LABEL" \
              --login "-u ${GITHUB_ACTOR} -p ${GHCR_TOKEN} ghcr.io" \
              --env "-e HF_TOKEN=${HF_TOKEN} -e HF_BUCKET=${HF_BUCKET} -e SMOKE_RUN_KEY=${SMOKE_RUN_KEY} -e VAST_LABEL=${VAST_LABEL} -e VAST_OFFER_ID=${VAST_OFFER_ID} -e EXPECTED_IMAGE=${RUNTIME_IMAGE} -e REMOTE_SCRIPT_B64=${REMOTE_SCRIPT_B64}" \
              --ssh \
              --direct \
              --onstart-cmd 'printf "%s" "$REMOTE_SCRIPT_B64" | base64 -d >/tmp/jpacf-vast-hf-smoke.sh && chmod 700 /tmp/jpacf-vast-hf-smoke.sh && /tmp/jpacf-vast-hf-smoke.sh' \
              --cancel-unavail
          )"
          printf '%s\n' "$create_response" > dist/vast-smoke/create-response.json
          instance_id="$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("dist/vast-smoke/create-response.json").read_text())
          value = payload.get("new_contract")
          if value is None:
              raise SystemExit("Vast create response did not contain new_contract")
          print(int(value))
          PY
          )"
          printf '%s\n' "$instance_id" > "$RUNNER_TEMP/vast-instance-id"
          echo "VAST_INSTANCE_ID=$instance_id" >> "$GITHUB_ENV"
          echo "Created Vast instance ${instance_id} from offer ${VAST_OFFER_ID}."

      - name: Poll HF Bucket for Vast-created success marker
        shell: bash
        run: |
          set -euo pipefail
          remote="hf://buckets/${HF_BUCKET}/runs/${SMOKE_RUN_KEY}/vast-smoke"
          local_dir="dist/vast-smoke/from-hf"
          source scripts/hf/hf-identity.sh
          found=0
          for attempt in $(seq 1 60); do
            rm -rf "$local_dir"
            mkdir -p "$local_dir"
            hf_bucket_cli buckets sync "$remote" "$local_dir" --token "$HF_TOKEN" \
              > dist/vast-smoke/hf-poll.txt 2>&1 || true
            if [[ -s "$local_dir/result.json" && -s "$local_dir/_SUCCESS" ]] \
              && grep -Fxq "$SMOKE_RUN_KEY" "$local_dir/_SUCCESS"; then
              found=1
              echo "HF Bucket evidence appeared on attempt ${attempt}."
              break
            fi
            echo "Waiting for Vast onstart artifact (${attempt}/60)."
            sleep 10
          done
          if [[ "$found" != 1 ]]; then
            echo "Vast did not publish the expected HF Bucket evidence within 10 minutes." >&2
            cat dist/vast-smoke/hf-poll.txt >&2 || true
            exit 1
          fi

      - name: Verify the Vast-created artifact from GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          remote="hf://buckets/${HF_BUCKET}/runs/${SMOKE_RUN_KEY}/vast-smoke"
          local_dir="dist/vast-smoke/from-hf"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads(Path("dist/vast-smoke/from-hf/result.json").read_text())
          assert result["provider"] == "vast"
          assert result["run_key"] == os.environ["SMOKE_RUN_KEY"]
          assert result["vast_label"] == os.environ["VAST_LABEL"]
          assert result["offer_id"] == int(os.environ["VAST_OFFER_ID"])
          assert result["expected_image"] == os.environ["RUNTIME_IMAGE"]
          assert result["cuda_available"] is True
          assert result["cuda_device_count"] >= 1
          assert result["cuda_tensor_checksum"] == 1240.0
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

          {
            echo "### Vast → HF Bucket smoke"
            echo
            echo "- offer: ${VAST_OFFER_ID}"
            echo "- GPU: ${VAST_GPU_NAME}"
            echo "- quoted rate: \$${VAST_DPH_TOTAL}/h"
            echo "- predicted ${PREDICTED_MINUTES} min cost: \$${VAST_PREDICTED_COST}"
            echo "- runtime: \`${RUNTIME_IMAGE}\`"
            echo "- evidence: \`${remote}\`"
            echo "- result: verified from a second client (GitHub runner)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture Vast logs on failure
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          if [[ -s "$RUNNER_TEMP/vast-instance-id" ]]; then
            id="$(cat "$RUNNER_TEMP/vast-instance-id")"
            uv run --locked vastai logs "$id" \
              --api-key "$VAST_API_KEY" \
              --tail 200 \
              > dist/vast-smoke/vast-container.log 2>&1 || true
          fi

      - name: Destroy Vast instance and recover any same-label leftovers
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          ids=""
          if [[ -s "$RUNNER_TEMP/vast-instance-id" ]]; then
            ids="$(cat "$RUNNER_TEMP/vast-instance-id")"
          fi

          raw="$(uv run --locked vastai show instances \
            --api-key "$VAST_API_KEY" \
            --label "$VAST_LABEL" \
            --raw 2>/dev/null)"
          recovered="$(printf '%s' "$raw" | python -c '
          import json, sys
          try:
              payload=json.load(sys.stdin)
          except Exception:
              raise SystemExit(0)
          rows = payload if isinstance(payload, list) else payload.get("instances", []) if isinstance(payload, dict) else []
          print(" ".join(str(row["id"]) for row in rows if isinstance(row, dict) and row.get("id") is not None))
          ' 2>/dev/null)"
          ids="$(printf '%s\n%s\n' "$ids" "$recovered" | tr ' ' '\n' | sed '/^$/d' | sort -u | tr '\n' ' ')"

          for id in $ids; do
            echo "Destroying Vast instance ${id}."
            uv run --locked vastai destroy instance "$id" --api-key "$VAST_API_KEY" -y || true
          done

      - name: Upload smoke evidence to GitHub Actions
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vast-hf-bucket-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/providers/vast-search-query.json
            dist/providers/vast-search-query.txt
            dist/providers/vast-inventory.json
            dist/providers/vast-inventory.md
            dist/providers/vast-selected-offer.json
            dist/vast-smoke/create-response.json
            dist/vast-smoke/hf-poll.txt
            dist/vast-smoke/vast-container.log
            dist/vast-smoke/from-hf/
          if-no-files-found: warn
          retention-days: 30
