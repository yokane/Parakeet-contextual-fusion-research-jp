model:
  name: nvidia/parakeet-tdt_ctc-0.6b-ja
  sample_rate: 16000

data:
  hf_repo: saeeew/JP-HomophoneBench
  hf_config: homophone8-audio
  hf_split: test
  index_manifest: data/generated/eval/bench_index.jsonl
  manifest: data/generated/eval/bench_index.jsonl
  nemo_manifest: data/generated/eval/nemo_eval.jsonl
  context_phrases: data/generated/eval/context_phrases.txt
  lm_corpus: data/generated/eval/lm_corpus.txt
  provenance: data/generated/eval/eval_provenance.json

output:
  root: results/staged
  metrics_parquet: results/staged/metrics_e00_e04.parquet
  summary_json: results/staged/summary_e00_e04.json

beam:
  size: 8
  strategy: malsd_batch
  blank_lm_score_mode: lm_weighted_full

fusion:
  ngpulm:
    enabled: false
    model_path: artifacts/lm/ja-6gram.nemo
    alpha: 0.20
  gpu_pb:
    enabled: false
    alpha: 1.0
    context_score: 1.0
    depth_scaling: 2.0
    bpe_mode: default
  ctc_local:
    enabled: false
    alpha: 0.20
    margin_frames: 8
    length_norm_power: 1.0
  phone:
    enabled: false
    alpha: 0.20
    checkpoint: artifacts/phone_head.pt
    length_norm_power: 1.0

sweeps:
  beam_size: [1, 2, 4, 8, 12, 16]
  ngpulm_alpha: [0.0, 0.05, 0.10, 0.20, 0.30, 0.40]
  gpu_pb_alpha: [0.0, 0.25, 0.50, 1.0, 1.5, 2.0]
  ctc_alpha: [0.0, 0.05, 0.10, 0.20, 0.40]
  phone_alpha: [0.0, 0.05, 0.10, 0.20, 0.40, 0.80]

metrics:
  primary:
    - cer
    - entity_accuracy
    - distractor_false_positive_rate
    - mrr
  oracle_k: [1, 4, 8, 16, 32]
  bootstrap_samples: 10000

gates:
  e05:
    category: near_homophone
    oracle_k: 8
    min_count: 10
    min_oracle_headroom: 0.03
